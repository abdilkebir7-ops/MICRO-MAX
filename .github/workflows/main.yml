name: MICRO-MAX Real Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Build Signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # 4. Install Android SDK packages
      # ============================================================
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Installing Android SDK packages..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready."

      # ============================================================
      # 5. Check Android project
      # ============================================================
      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android project..."

          test -f settings.gradle.kts || \
          test -f settings.gradle

          test -f app/build.gradle.kts || \
          test -f app/build.gradle

          test -f app/src/main/AndroidManifest.xml

          test -f gradlew

          chmod +x gradlew

          echo "Android project OK."

      # ============================================================
      # 6. Check Gradle
      # ============================================================
      - name: Check Gradle
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew --version

      # ============================================================
      # 7. Prepare signing keystore
      # ============================================================
      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MICROMAX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Preparing release keystore..."

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          mkdir -p "$RUNNER_TEMP/micromax"

          KEYSTORE_PATH="$RUNNER_TEMP/micromax/micromax-upload.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          echo "Checking keystore..."

          keytool \
            -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "MICROMAX_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Keystore is valid."

      # ============================================================
      # 8. Configure optional application environment
      # ============================================================
      - name: Configure application environment
        shell: bash
        env:
          API_BASE_URL: ${{ secrets.MICROMAX_API_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.MICROMAX_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail

          # Backend URL is OPTIONAL for compilation.
          # No fake URL is inserted.

          if [ -n "${API_BASE_URL:-}" ]; then
            echo "MICROMAX_API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"
            echo "Backend URL configured."
          else
            echo "MICROMAX_API_BASE_URL=" >> "$GITHUB_ENV"
            echo "Backend URL is not configured."
            echo "Build will continue."
          fi

          if [ -n "${GOOGLE_WEB_CLIENT_ID:-}" ]; then
            echo "MICROMAX_GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" >> "$GITHUB_ENV"
            echo "Google Client ID configured."
          else
            echo "MICROMAX_GOOGLE_WEB_CLIENT_ID=" >> "$GITHUB_ENV"
            echo "Google Client ID is not configured."
          fi

      # ============================================================
      # 9. Export signing variables
      # ============================================================
      - name: Configure signing environment
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.MICROMAX_KEY_ALIAS }}
          KEY_PASSWORD_VALUE: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "MICROMAX_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MICROMAX_KEY_ALIAS=$KEY_ALIAS_VALUE" >> "$GITHUB_ENV"
          echo "MICROMAX_KEY_PASSWORD=$KEY_PASSWORD_VALUE" >> "$GITHUB_ENV"

          echo "Signing environment configured."

      # ============================================================
      # 10. Clean
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning project..."

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ============================================================
      # 11. Build Release APK
      # ============================================================
      - name: Build signed APK
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING MICRO-MAX RELEASE APK"
          echo "======================================"

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode all

      # ============================================================
      # 12. Build Release AAB
      # ============================================================
      - name: Build signed AAB
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING MICRO-MAX RELEASE AAB"
          echo "======================================"

          ./gradlew \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode all

      # ============================================================
      # 13. Check output
      # ============================================================
      - name: Check release files
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          echo "Checking APK..."

          test -s "$APK"

          echo "Checking AAB..."

          test -s "$AAB"

          echo
          echo "======================================"
          echo "RELEASE FILES"
          echo "======================================"

          ls -lh "$APK"
          ls -lh "$AAB"

      # ============================================================
      # 14. Verify APK signature
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -f "$APKSIGNER"

          echo "Verifying APK signature..."

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo "APK signature OK."

      # ============================================================
      # 15. Verify AAB signature
      # ============================================================
      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail

          AAB="app/build/outputs/bundle/release/app-release.aab"

          echo "Verifying AAB signature..."

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo "AAB signature OK."

      # ============================================================
      # 16. Generate checksums
      # ============================================================
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp \
            app/build/outputs/apk/release/app-release.apk \
            release/MICRO-MAX-release.apk

          cp \
            app/build/outputs/bundle/release/app-release.aab \
            release/MICRO-MAX-release.aab

          sha256sum \
            release/MICRO-MAX-release.apk \
            release/MICRO-MAX-release.aab \
            > release/SHA256SUMS.txt

          echo
          echo "======================================"
          echo "CHECKSUMS"
          echo "======================================"

          cat release/SHA256SUMS.txt

      # ============================================================
      # 17. Include mapping file if available
      # ============================================================
      - name: Include mapping
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "app/build/outputs/mapping/release/mapping.txt" ]; then
            cp \
              app/build/outputs/mapping/release/mapping.txt \
              release/mapping.txt

            echo "mapping.txt included."
          else
            echo "No mapping.txt found."
          fi

      # ============================================================
      # 18. Final release check
      # ============================================================
      - name: Final release check
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "======================================"
          echo "MICRO-MAX RELEASE READY"
          echo "======================================"

          test -s release/MICRO-MAX-release.apk
          test -s release/MICRO-MAX-release.aab
          test -s release/SHA256SUMS.txt

          echo
          ls -lah release/

      # ============================================================
      # 19. Upload APK + AAB
      # ============================================================
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-REAL-RELEASE
          path: release/
          if-no-files-found: error
          retention-days: 30
