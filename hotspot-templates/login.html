<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>بوابة الإنترنت</title>
<style>
:root{--ink:#f8fafc;--muted:#9fb0c7;--line:rgba(255,255,255,.14);--panel:rgba(10,22,41,.78);--accent:#38d9c4;--accent2:#5b8cff;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;display:grid;place-items:center;background:radial-gradient(circle at 15% 10%,#155e75 0,transparent 34%),radial-gradient(circle at 90% 90%,#312e81 0,transparent 35%),#050b16;color:var(--ink);font-family:Tahoma,Arial,sans-serif}.shell{width:min(460px,100%);position:relative}.glow{position:absolute;inset:-2px;border-radius:32px;background:linear-gradient(135deg,var(--accent),transparent 38%,var(--accent2));filter:blur(18px);opacity:.26;z-index:-1}.card{border:1px solid var(--line);border-radius:30px;padding:26px;background:var(--panel);backdrop-filter:blur(22px);box-shadow:0 30px 100px #0009}.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 30px #38d9c455}.logo svg{width:26px;fill:#06111f}.brand strong{font-size:25px;letter-spacing:.5px}.sub{color:var(--muted);font-size:13px;margin:0 0 20px}.status{min-height:22px;color:var(--danger);font-size:13px;margin:8px 0}.field{position:relative;margin:11px 0}.field svg{position:absolute;right:15px;top:15px;width:20px;fill:var(--muted);transition:.2s}.field input{width:100%;height:52px;padding:0 48px 0 14px;border:1px solid var(--line);border-radius:16px;background:#020817aa;color:var(--ink);font-size:15px;outline:0;transition:.22s}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px #38d9c422,0 10px 26px #0003;transform:translateY(-1px)}.field input:focus+svg{fill:var(--accent);transform:scale(1.08)}button,.wa{width:100%;border:0;border-radius:16px;min-height:52px;font-weight:800;font-size:15px;cursor:pointer;transition:.18s}.primary{margin-top:8px;background:linear-gradient(135deg,var(--accent),#75f0d1);color:#06201e;box-shadow:0 12px 28px #38d9c433}.primary:active,.plan:active,.wa:active{transform:scale(.98)}.plans{margin-top:22px}.plans h2{font-size:15px;margin:0 0 10px}.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.plan{border:1px solid var(--line);border-radius:15px;background:#ffffff08;color:var(--ink);padding:11px 6px;font-size:12px}.plan.selected{border-color:var(--accent);background:#38d9c41b;color:#bffff4}.plan b{display:block;font-size:14px;margin-bottom:4px}.wa{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:13px;text-decoration:none;background:#25d366;color:#052512}.wa svg{width:20px;fill:currentColor}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:18px}@media(max-width:370px){.card{padding:20px}.plan-grid{grid-template-columns:1fr 1fr}}
</style></head><body><main class="shell"><div class="glow"></div><section class="card"><header class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M12 2a9 9 0 0 0-9 9v3a3 3 0 0 0 3 3h2v-7H5a7 7 0 0 1 14 0h-3v7h2a3 3 0 0 0 3-3v-3a9 9 0 0 0-9-9Zm-1 17h2v3h-2v-3Z"/></svg></span><strong>بوابة الإنترنت</strong></header><p class="sub">اتصال سريع وآمن — اختر باقتك ثم أدخل بيانات الكرت</p><div class="status">$(error)</div><form action="$(link-login-only)" method="post" autocomplete="on"><input type="hidden" name="dst" value="$(link-orig)"><label class="field"><input name="username" autocomplete="username" placeholder="اسم المستخدم" required><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5c0-3-4-5.5-9-5.5Z"/></svg></label><label class="field"><input type="password" name="password" autocomplete="current-password" placeholder="كلمة المرور" required><svg viewBox="0 0 24 24"><path d="M17 8h-1V6a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-5 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm2-9h-4V6a2 2 0 1 1 4 0v2Z"/></svg></label><button class="primary" type="submit">دخول إلى الإنترنت</button></form><div class="plans"><h2>اختر الباقة المناسبة</h2><div class="plan-grid"><button class="plan" data-plan="اقتصادية"><b>اقتصادية</b>سرعة أساسية</button><button class="plan" data-plan="متقدمة"><b>متقدمة</b>سرعة أعلى</button><button class="plan" data-plan="VIP"><b>VIP</b>أولوية قصوى</button></div></div><a class="wa" id="wa" href="https://wa.me/218930090401" target="_blank" rel="noopener"><span>واتساب: +218 93 009 0401 — استفسار وشراء باقة</span></a><div class="foot">أدخل بيانات الكرت الموجودة لديك أو تواصل مع الدعم</div></section></main><script>(function(){var wa=document.getElementById('wa');document.querySelectorAll('.plan').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.plan').forEach(function(x){x.classList.remove('selected')});b.classList.add('selected');wa.href='https://wa.me/218930090401?text='+encodeURIComponent('مرحباً، أريد الاستفسار عن باقة '+b.dataset.plan+' لشبكة Wi-Fi');});});try{var q=new URLSearchParams(location.search),u=q.get('username'),p=q.get('password'),f=document.forms[0];if(u)f.username.value=u;if(p)f.password.value=p;else if(u&&!q.has('password'))f.password.value=u;if(u&&history.replaceState)history.replaceState(null,'',location.pathname);var st=document.querySelector('.status')||{},msg=String(st.textContent||'').trim(),failed=msg!==''&&msg.indexOf('$(')!==0,key='mmauto:'+u,now=Date.now(),last=Number(sessionStorage.getItem(key)||0);if(q.get('auto')==='1'&&u&&f.password.value&&!failed&&now-last>15000){sessionStorage.setItem(key,String(now));var b=f.querySelector('button[type=submit]');if(b)b.textContent='\u062c\u0627\u0631\u064d \u062a\u0633\u062c\u064a\u0644 \u0627\u0644\u062f\u062e\u0648\u0644\u2026';f.submit();}}catch(e){}})();</script></body></html>
