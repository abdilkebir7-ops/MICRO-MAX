name: MICRO-MAX Real Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: micromax-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build Signed APK + AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v7

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # =========================================================
      # 3. Android SDK
      #
      # مهم:
      # لا نستخدم sdkmanager لتثبيت platform-tools هنا.
      # Ubuntu runner يحتوي Android SDK مسبقاً.
      # =========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"

          echo "Android SDK:"
          ls -la "$ANDROID_HOME" | head -50

          echo
          echo "Platform tools:"
          test -d "$ANDROID_HOME/platform-tools"
          "$ANDROID_HOME/platform-tools/adb" version

          echo
          echo "Build tools:"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" version

          echo
          echo "Android 35:"
          test -d "$ANDROID_HOME/platforms/android-35"

          echo
          echo "Android SDK verification OK"

      # =========================================================
      # 4. Project validation
      # =========================================================
      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f gradlew
          test -f app/build.gradle.kts

          chmod +x gradlew

          echo "Android project OK"

      # =========================================================
      # 5. Prepare signing keystore
      # =========================================================
      - name: Prepare Keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MICROMAX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "ERROR: MICROMAX_KEYSTORE_BASE64 is missing"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/micromax"

          KEYSTORE="$RUNNER_TEMP/micromax/micromax-upload.jks"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "MICROMAX_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Keystore prepared successfully"

      # =========================================================
      # 6. Backend configuration
      # =========================================================
      - name: Configure Backend
        shell: bash
        env:
          API_URL: ${{ secrets.MICROMAX_API_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${API_URL:-}" ]; then
            echo "ERROR: MICROMAX_API_BASE_URL is missing"
            exit 1
          fi

          case "$API_URL" in
            https://*)
              echo "Backend HTTPS: OK"
              ;;
            *)
              echo "ERROR: Backend URL must start with https://"
              exit 1
              ;;
          esac

          echo "MICROMAX_API_BASE_URL=$API_URL" >> "$GITHUB_ENV"

      # =========================================================
      # 7. Google Client ID
      # =========================================================
      - name: Configure Google Client ID
        shell: bash
        env:
          GOOGLE_ID: ${{ secrets.MICROMAX_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_ID:-}" ]; then
            echo "ERROR: MICROMAX_GOOGLE_WEB_CLIENT_ID is missing"
            exit 1
          fi

          echo "MICROMAX_GOOGLE_WEB_CLIENT_ID=$GOOGLE_ID" >> "$GITHUB_ENV"

      # =========================================================
      # 8. Signing secrets
      # =========================================================
      - name: Check Signing Secrets
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${STORE_PASSWORD:-}" ]; then
            echo "ERROR: MICROMAX_KEYSTORE_PASSWORD is missing"
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: MICROMAX_KEY_ALIAS is missing"
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: MICROMAX_KEY_PASSWORD is missing"
            exit 1
          fi

          echo "Signing secrets OK"

      # =========================================================
      # 9. Check Java / Gradle
      # =========================================================
      - name: Check Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          java -version

          ./gradlew --version

      # =========================================================
      # 10. Clean
      # =========================================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 11. Build Release APK
      # =========================================================
      - name: Build signed APK
        shell: bash
        env:
          MICROMAX_KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          MICROMAX_KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          MICROMAX_KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 12. Build Release AAB
      # =========================================================
      - name: Build signed AAB
        shell: bash
        env:
          MICROMAX_KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          MICROMAX_KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          MICROMAX_KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 13. Check generated files
      # =========================================================
      - name: Check release files
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            find app/build/outputs -type f -maxdepth 6 || true
            exit 1
          fi

          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB was not generated"
            find app/build/outputs -type f -maxdepth 6 || true
            exit 1
          fi

          mkdir -p release

          cp "$APK" release/MICRO-MAX-release.apk
          cp "$AAB" release/MICRO-MAX-release.aab

          echo
          echo "Release files:"
          ls -lh release/

      # =========================================================
      # 14. Verify APK signature
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            release/MICRO-MAX-release.apk

          echo "APK signature verified"

      # =========================================================
      # 15. Verify AAB signature
      # =========================================================
      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail

          jarsigner \
            -verify \
            -verbose \
            -certs \
            release/MICRO-MAX-release.aab

          echo "AAB signature verified"

      # =========================================================
      # 16. Generate SHA256
      # =========================================================
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          cd release

          sha256sum \
            MICRO-MAX-release.apk \
            MICRO-MAX-release.aab \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      # =========================================================
      # 17. Upload artifacts
      # =========================================================
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-REAL-RELEASE
          path: release/
          if-no-files-found: error
          retention-days: 30
