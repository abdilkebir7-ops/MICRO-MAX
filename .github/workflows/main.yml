name: Build MICRO-MAX Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. Checkout
      # ==============================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================
      # 2. Java 17
      # ==============================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==============================
      # 3. Verify Android project
      # ==============================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Checking MICRO-MAX Android project"
          echo "======================================"

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "::error::settings.gradle.kts or settings.gradle not found"
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            echo "::error::Root build.gradle.kts or build.gradle not found"
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "::error::app module not found"
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "::error::app/build.gradle.kts or app/build.gradle not found"
            exit 1
          fi

          echo "Android project structure OK."

          echo
          echo "Project files:"
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            | sort

      # ==============================
      # 4. Gradle wrapper
      # ==============================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "::error::gradlew not found"
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper ready."

      # ==============================
      # 5. Verify MainActivity
      # ==============================
      - name: Verify MainActivity
        shell: bash
        run: |
          set -e

          MAIN_ACTIVITY=$(find app/src/main -type f -name "MainActivity.kt" | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::MainActivity.kt not found"
            exit 1
          fi

          echo "MainActivity found:"
          echo "$MAIN_ACTIVITY"

      # ==============================
      # 6. Clean
      # ==============================
      - name: Clean project
        shell: bash
        run: |
          set -e
          ./gradlew clean --no-daemon --stacktrace

      # ==============================
      # 7. Build Debug APK
      # ==============================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ==============================
      # 8. Verify APK
      # ==============================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."
            echo "Available APK files:"
            find app/build -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          echo "======================================"
          echo "APK generated successfully"
          echo "======================================"

          ls -lh "$APK"

      # ==============================
      # 9. Upload APK
      # ==============================
      - name: Upload MICRO-MAX APK
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
