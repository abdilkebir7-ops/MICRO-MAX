name: MICRO-MAX Debug APK
run-name: MICRO-MAX v3.1.0 Debug APK #${{ github.run_number }}
# Builds an installable test APK with no secrets or keystore needed.
# Run: GitHub → Actions → "MICRO-MAX Debug APK" → Run workflow → download the "micromax-debug-apk" artifact.
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build
        shell: bash
        env:
          MICROMAX_API_BASE_URL: ${{ secrets.MICROMAX_API_BASE_URL || 'https://micro-max-api.onrender.com' }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-v3.1.0-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
