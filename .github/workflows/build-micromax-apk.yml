name: Build MICRO-MAX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check project
        run: |
          echo "=== Project files ==="
          ls -la
          echo "=== App directory ==="
          ls -la app || true

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p release

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not found"
            exit 1
          fi

          cp "$APK" release/MICRO-MAX.apk

          echo "APK ready:"
          ls -lh release/MICRO-MAX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-APK
          path: release/MICRO-MAX.apk
          if-no-files-found: error
