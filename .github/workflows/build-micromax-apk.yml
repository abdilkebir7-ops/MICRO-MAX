name: Build MICRO-MAX APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل المشروع
      - name: Checkout source
        uses: actions/checkout@v6

      # 2. إعداد Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. إعداد Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. تثبيت Gradle مباشرة
      # لا يحتاج إلى gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      # 5. إظهار الملفات للتأكد من بنية المشروع
      - name: Check project structure
        run: |
          echo "===== PROJECT ====="
          ls -la
          echo "===== APP ====="
          ls -la app || true
          echo "===== GRADLE ====="
          gradle --version

      # 6. إعطاء صلاحيات للـ Gradle إن وُجد
      - name: Prepare build
        run: |
          chmod +x gradlew 2>/dev/null || true

      # 7. بناء Debug APK
      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      # 8. البحث عن APK
      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "❌ APK not found"
            echo "===== BUILD DIRECTORIES ====="
            find . -type d -name build -print
            exit 1
          fi

          echo "✅ APK found: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # 9. إعادة تسمية APK
      - name: Rename APK
        run: |
          mkdir -p release
          cp "${{ steps.find_apk.outputs.apk }}" \
             "release/MICRO-MAX-debug.apk"

      # 10. رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-APK
          path: release/MICRO-MAX-debug.apk
          if-no-files-found: error
