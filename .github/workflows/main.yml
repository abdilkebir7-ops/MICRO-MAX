name: MICRO-MAX Real Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Build Signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # 1. تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2. التحقق من مشروع Android
      - name: Check Android Project
        shell: bash
        run: |
          set -e

          test -f gradlew
          test -f app/build.gradle.kts

          chmod +x gradlew

          echo "Android project OK"

      # 3. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. تثبيت SDK المطلوب
      # ملاحظة: لا يوجد tools هنا
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK installed successfully"

      # 6. التحقق من SDK
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          "$ANDROID_HOME/platform-tools/adb" version

          echo "Android SDK verification OK"

      # 7. تجهيز Keystore
      - name: Prepare Keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MICROMAX_KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_B64"

          mkdir -p "$RUNNER_TEMP/micromax"

          KEYSTORE="$RUNNER_TEMP/micromax/micromax-upload.jks"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "MICROMAX_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Keystore prepared"

      # 8. فحص رابط Backend
      - name: Configure Backend
        shell: bash
        env:
          API_URL: ${{ secrets.MICROMAX_API_BASE_URL }}
        run: |
          set -e

          test -n "$API_URL"

          case "$API_URL" in
            https://*)
              echo "Backend HTTPS OK"
              ;;
            *)
              echo "ERROR: Backend URL must use HTTPS"
              exit 1
              ;;
          esac

          echo "MICROMAX_API_BASE_URL=$API_URL" >> "$GITHUB_ENV"

      # 9. Google Client ID
      - name: Configure Google Client ID
        shell: bash
        env:
          GOOGLE_ID: ${{ secrets.MICROMAX_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -e

          test -n "$GOOGLE_ID"

          echo "MICROMAX_GOOGLE_WEB_CLIENT_ID=$GOOGLE_ID" >> "$GITHUB_ENV"

      # 10. التحقق من مفاتيح التوقيع
      - name: Check Signing Secrets
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "Signing secrets OK"

      # 11. تنظيف المشروع
      - name: Clean Project
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # 12. بناء APK + AAB
      - name: Build Signed APK and AAB
        shell: bash
        env:
          MICROMAX_KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          MICROMAX_KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          MICROMAX_KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -e

          ./gradlew \
            :app:assembleRelease \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace

      # 13. التحقق من الملفات
      - name: Check Release Files
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          test -f "$APK"
          test -f "$AAB"

          mkdir -p release

          cp "$APK" release/MICRO-MAX-release.apk
          cp "$AAB" release/MICRO-MAX-release.aab

          echo "Release files:"
          ls -lh release/

      # 14. التحقق من توقيع APK
      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -f "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            release/MICRO-MAX-release.apk

          echo "APK signature OK"

      # 15. التحقق من توقيع AAB
      - name: Verify AAB Signature
        shell: bash
        run: |
          set -e

          jarsigner \
            -verify \
            -certs \
            release/MICRO-MAX-release.aab

          echo "AAB signature OK"

      # 16. رفع الملفات
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-REAL-RELEASE
          path: release/
          if-no-files-found: error
          retention-days: 30
