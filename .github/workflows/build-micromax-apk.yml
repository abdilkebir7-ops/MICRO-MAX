name: Build MICRO-MAX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # مهم:
      # لا نطلب tools القديمة
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Extract MICRO-MAX project
        shell: bash
        run: |
          set -e

          echo "Searching for MICRO-MAX ZIP..."

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

          find extracted -maxdepth 4 -type f | sort | head -300

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found."

            echo "Searching project files:"
            find extracted -maxdepth 6 -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Android project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          echo "===== PROJECT ====="

          pwd

          echo
          echo "===== FILES ====="

          find . -maxdepth 4 -type f | sort

          echo
          echo "===== GRADLE FILES ====="

          find . -maxdepth 5 -type f \
            \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradle.properties" \
            -o -name "gradlew" \
            \) \
            -print

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Gradle
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then

            echo "Gradle Wrapper found."

            chmod +x ./gradlew

          else

            echo "Gradle Wrapper not found."

            wget -q \
              https://services.gradle.org/distributions/gradle-8.10.2-bin.zip \
              -O /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /tmp/gradle

            /tmp/gradle/gradle-8.10.2/bin/gradle wrapper \
              --gradle-version 8.10.2

            chmod +x ./gradlew

          fi

      - name: Verify Gradle
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          ./gradlew --version

          echo "===== GRADLE TASKS ====="

          ./gradlew tasks --no-daemon

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "===== APK FILES ====="

          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp "${{ steps.project.outputs.project_dir }}/${{ steps.apk.outputs.apk_path }}" \
            "release/MICRO-MAX-V2.16.0.apk"

          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-V2.16.0-APK
          path: release/MICRO-MAX-V2.16.0.apk
          if-no-files-found: error
