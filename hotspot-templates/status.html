<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>حالة الاتصال</title><style>:root{--ink:#f8fafc;--muted:#9fb0c7;--line:#ffffff20;--panel:#0b1729d9;--a:#38d9c4;--a2:#5b8cff}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;display:grid;place-items:center;background:radial-gradient(circle at 15% 10%,#155e75,transparent 35%),radial-gradient(circle at 90% 90%,#312e81,transparent 35%),#050b16;color:var(--ink);font-family:Tahoma,Arial,sans-serif}.card{width:min(520px,100%);border:1px solid var(--line);border-radius:30px;padding:26px;background:var(--panel);backdrop-filter:blur(22px);box-shadow:0 30px 100px #0009}.top{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--a2))}.logo svg{width:26px;fill:#06111f}.top h1{margin:0;font-size:23px}.muted{color:var(--muted);font-size:13px;margin-top:5px}.online{margin:20px 0;padding:14px 16px;border-radius:18px;background:#38d9c415;border:1px solid #38d9c44a;color:#bffff4;font-weight:700}.online i{display:inline-block;width:9px;height:9px;background:var(--a);border-radius:50%;margin-left:7px;box-shadow:0 0 0 5px #38d9c422}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{padding:16px;border:1px solid var(--line);border-radius:18px;background:#ffffff08}.k{color:var(--muted);font-size:11px}.v{display:block;margin-top:7px;font-size:17px;font-weight:800;overflow-wrap:anywhere}.actions{display:flex;gap:10px;margin-top:18px}.actions a{flex:1;text-align:center;text-decoration:none;padding:14px;border-radius:15px;font-weight:800}.refresh{background:#ffffff12;color:var(--ink);border:1px solid var(--line)}.logout{background:linear-gradient(135deg,var(--a),#75f0d1);color:#06201e}@media(max-width:380px){.grid{grid-template-columns:1fr}.actions{flex-direction:column}}</style></head><body><main class="card"><header class="top"><span class="logo"><svg viewBox="0 0 24 24"><path d="M12 2a9 9 0 0 0-9 9v3a3 3 0 0 0 3 3h2v-7H5a7 7 0 0 1 14 0h-3v7h2a3 3 0 0 0 3-3v-3a9 9 0 0 0-9-9Zm-1 17h2v3h-2v-3Z"/></svg></span><div><h1>حالة الاتصال</h1><div class="muted">معلومات جلستك الحالية</div></div></header><div class="online"><i></i>متصل بالإنترنت الآن</div><section class="grid"><div class="item"><span class="k">المستخدم</span><strong class="v">$(username)</strong></div><div class="item"><span class="k">عنوان الجهاز</span><strong class="v">$(ip)</strong></div><div class="item"><span class="k">التحميل</span><strong class="v">$(bytes-out-nice)</strong></div><div class="item"><span class="k">الرفع</span><strong class="v">$(bytes-in-nice)</strong></div><div class="item"><span class="k">الوقت المتبقي</span><strong class="v">$(session-time-left)</strong></div><div class="item"><span class="k">مدة الجلسة</span><strong class="v">$(uptime)</strong></div></section><div class="actions"><a class="refresh" href="$(link-status)">تحديث البيانات</a><a class="logout" href="$(link-logout)">تسجيل الخروج</a></div></main></body></html>
