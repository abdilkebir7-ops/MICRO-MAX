name: MICRO-MAX Real Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  MICROMAX_API_BASE_URL: https://karim-max-hotspot-manager.onrender.com

jobs:
  release:
    name: Build Signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify backend configuration
        shell: bash
        run: |
          set -e
          echo "Backend configured:"
          echo "$MICROMAX_API_BASE_URL"
          test -n "$MICROMAX_API_BASE_URL"

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x ./gradlew

      - name: Clean project
        shell: bash
        run: |
          ./gradlew clean --no-daemon

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        shell: bash
        run: |
          ./gradlew assembleRelease --no-daemon || true

      - name: Build release AAB
        shell: bash
        run: |
          ./gradlew bundleRelease --no-daemon || true

      - name: Check generated files
        shell: bash
        run: |
          echo "Generated files:"
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-release
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
