name: MICRO-MAX Real Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Build Signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================
      # 3. Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ==========================================
      # 4. Android SDK packages
      # ==========================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready"

      # ==========================================
      # 5. Check Android project
      # ==========================================
      - name: Check Android project
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f gradlew

          chmod +x gradlew

          echo "Android project OK"

      # ==========================================
      # 6. Check Gradle
      # ==========================================
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          ./gradlew --version

      # ==========================================
      # 7. Prepare signing keystore
      # ==========================================
      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MICROMAX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}

        run: |
          set -e

          echo "Preparing release keystore..."

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          mkdir -p "$RUNNER_TEMP/micromax"

          KEYSTORE_PATH="$RUNNER_TEMP/micromax/micromax-release.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          keytool \
            -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "MICROMAX_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Keystore verified successfully"

      # ==========================================
      # 8. Configure application environment
      # ==========================================
      - name: Configure application environment
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.MICROMAX_GOOGLE_WEB_CLIENT_ID }}

        run: |
          set -e

          # ========================================
          # REAL PRODUCTION BACKEND
          # ========================================
          API_BASE_URL="https://karim-max-hotspot-manager.onrender.com"

          echo "MICROMAX_API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"

          echo "Backend configured:"
          echo "$API_BASE_URL"

          # ========================================
          # Google Client ID
          # ========================================
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "MICROMAX_GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" >> "$GITHUB_ENV"
            echo "Google Client ID configured"
          else
            echo "MICROMAX_GOOGLE_WEB_CLIENT_ID=REPLACE_WITH_GOOGLE_WEB_CLIENT_ID" >> "$GITHUB_ENV"
            echo "Google Client ID not configured"
          fi

          echo "Application environment ready"

      # ==========================================
      # 9. Verify backend configuration
      # ==========================================
      - name: Verify backend configuration
        shell: bash
        run: |
          set -e

          test -n "$MICROMAX_API_BASE_URL"

          if [ "$MICROMAX_API_BASE_URL" = "https://api.example.com" ]; then
            echo "ERROR: Example backend URL detected."
            exit 1
          fi

          echo "Backend URL:"
          echo "$MICROMAX_API_BASE_URL"

          echo "Backend configuration OK"

      # ==========================================
      # 10. Configure signing environment
      # ==========================================
      - name: Configure signing environment
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}

        run: |
          set -e

          test -n "$MICROMAX_KEYSTORE_PATH"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "Signing environment ready"

      # ==========================================
      # 11. Clean project
      # ==========================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ==========================================
      # 12. Build signed APK
      # ==========================================
      - name: Build signed APK
        shell: bash
        env:
          MICROMAX_KEYSTORE_PATH: ${{ env.MICROMAX_KEYSTORE_PATH }}
          MICROMAX_KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          MICROMAX_KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          MICROMAX_KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
          MICROMAX_API_BASE_URL: ${{ env.MICROMAX_API_BASE_URL }}
          MICROMAX_GOOGLE_WEB_CLIENT_ID: ${{ env.MICROMAX_GOOGLE_WEB_CLIENT_ID }}

        run: |
          set -e

          echo "======================================"
          echo "MICRO-MAX RELEASE APK"
          echo "======================================"

          echo "Backend:"
          echo "$MICROMAX_API_BASE_URL"

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ==========================================
      # 13. Build signed AAB
      # ==========================================
      - name: Build signed AAB
        shell: bash
        env:
          MICROMAX_KEYSTORE_PATH: ${{ env.MICROMAX_KEYSTORE_PATH }}
          MICROMAX_KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          MICROMAX_KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          MICROMAX_KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
          MICROMAX_API_BASE_URL: ${{ env.MICROMAX_API_BASE_URL }}
          MICROMAX_GOOGLE_WEB_CLIENT_ID: ${{ env.MICROMAX_GOOGLE_WEB_CLIENT_ID }}

        run: |
          set -e

          echo "======================================"
          echo "MICRO-MAX RELEASE AAB"
          echo "======================================"

          echo "Backend:"
          echo "$MICROMAX_API_BASE_URL"

          ./gradlew :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ==========================================
      # 14. Check release files
      # ==========================================
      - name: Check release files
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          test -s "$APK"
          test -s "$AAB"

          mkdir -p release

          cp "$APK" release/MICRO-MAX-release.apk
          cp "$AAB" release/MICRO-MAX-release.aab

          echo "Release files:"
          ls -lh release/

      # ==========================================
      # 15. Verify APK signature
      # ==========================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -f "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            release/MICRO-MAX-release.apk

          echo "APK signature OK"

      # ==========================================
      # 16. Verify AAB signature
      # ==========================================
      - name: Verify AAB signature
        shell: bash
        run: |
          set -e

          jarsigner \
            -verify \
            -verbose \
            -certs \
            release/MICRO-MAX-release.aab

          echo "AAB signature OK"

      # ==========================================
      # 17. Generate checksums
      # ==========================================
      - name: Generate checksums
        shell: bash
        run: |
          set -e

          sha256sum \
            release/MICRO-MAX-release.apk \
            release/MICRO-MAX-release.aab \
            > release/SHA256SUMS.txt

          cat release/SHA256SUMS.txt

      # ==========================================
      # 18. Include mapping
      # ==========================================
      - name: Include mapping
        shell: bash
        run: |
          set -e

          MAPPING="app/build/outputs/mapping/release/mapping.txt"

          if [ -f "$MAPPING" ]; then
            cp "$MAPPING" release/mapping.txt
            echo "mapping.txt included"
          else
            echo "No mapping.txt found"
          fi

      # ==========================================
      # 19. Final release check
      # ==========================================
      - name: Final release check
        shell: bash
        run: |
          set -e

          test -s release/MICRO-MAX-release.apk
          test -s release/MICRO-MAX-release.aab
          test -s release/SHA256SUMS.txt

          echo ""
          echo "======================================"
          echo "MICRO-MAX RELEASE READY"
          echo "======================================"

          echo "Backend:"
          echo "$MICROMAX_API_BASE_URL"

          echo ""
          ls -lh release/

      # ==========================================
      # 20. Upload APK + AAB
      # ==========================================
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-release
          path: release/
          retention-days: 30
