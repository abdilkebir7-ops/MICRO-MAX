<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="pragma" content="no-cache"><meta http-equiv="expires" content="-1">
<title>%%BRANDA%% %%BRANDB%% • Wi-Fi</title>
<style>
:root{--bg:%%BG%%;--bg2:%%BG2%%;--card:%%CARD%%;--cs:%%CS%%;--tx:%%TX%%;--mut:%%MUT%%;--line:%%LINE%%;--cy:%%P1%%;--vi:%%P2%%;--gold:%%GOLD%%;--gold2:%%GOLD2%%;--err:#fb7185;--inp:%%INP%%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Roboto,sans-serif;color:var(--tx);background:radial-gradient(70% 45% at 50% -5%,rgba(%%P2RGB%%,.28),transparent 70%),radial-gradient(60% 40% at 100% 100%,rgba(%%P1RGB%%,.2),transparent 70%),linear-gradient(160deg,var(--bg),var(--bg2)) fixed;display:flex;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom));overflow-x:hidden}
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.w{position:relative;z-index:1;width:100%;max-width:430px;animation:up .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:20px}
.brand{font-weight:800;font-size:15px;letter-spacing:.5px}.brand small{display:block;color:var(--mut);font-weight:500;font-size:10px;letter-spacing:2px}
.btns{display:flex;gap:8px;align-items:center}
.pill{border:1.5px solid var(--line);color:var(--cy);background:var(--card);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.dot{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:800;letter-spacing:1px;color:#34d399}
.dot i{width:8px;height:8px;border-radius:50%;background:#34d399;animation:pl 1.8s infinite}
@keyframes pl{to{box-shadow:0 0 0 9px rgba(52,211,153,0)}}
.dot i{box-shadow:0 0 0 0 rgba(52,211,153,.6)}
.gb{position:relative;border-radius:30px;padding:1.5px;overflow:hidden;background:var(--line);box-shadow:0 22px 50px %%SHADOW%%,0 0 40px rgba(%%P2RGB%%,.14)}
.gb::before{content:"";position:absolute;inset:0;background:conic-gradient(transparent 0 55%,var(--gold) 75%,var(--cy) 88%,transparent)}
.gb>.in{position:relative;background:var(--cs);border-radius:28.5px;padding:22px}
.foot{text-align:center;color:var(--mut);font-size:11px;margin-top:18px;letter-spacing:1px}
.shk{animation:shk .5s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.hint{margin:12px 0 0;padding:11px 13px;border-radius:14px;background:rgba(%%P2RGB%%,.10);color:var(--tx);font-size:13.5px;line-height:1.7;font-weight:600}
.hint b{color:var(--cy)}
.seg button{font-size:14px}
.seg button.on b{filter:none}
label{color:var(--tx)}
.f input{font-weight:600}
.chips div{box-shadow:0 4px 12px rgba(0,0,0,.06)}

.hero{text-align:center;margin-bottom:20px}
.logo{position:relative;width:88px;height:88px;margin:0 auto 14px;border-radius:28px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);box-shadow:0 0 0 8px rgba(%%GOLDRGB%%,.10),0 10px 30px rgba(%%GOLDRGB%%,.35)}
.logo svg{width:50px;height:50px;overflow:visible}
.a1,.a2,.a3{animation:ar 2s infinite;opacity:.25}.a2{animation-delay:.25s}.a3{animation-delay:.5s}
@keyframes ar{30%,60%{opacity:1}}
.kick{font-size:11px;font-weight:800;letter-spacing:5px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes gl{to{background-position:-200% 0}}
h1{margin:8px 0 8px;font-size:48px;line-height:1;font-weight:900;direction:ltr;letter-spacing:-1px}
h1 b{background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:14px;line-height:1.7;margin:0}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:800}
.ch span{color:var(--gold);border:1px solid var(--gold);border-radius:12px;padding:5px 10px;font-size:11px;letter-spacing:1px}
label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px;color:var(--mut)}
.f{position:relative}
.f input{width:100%;height:58px;border-radius:18px;border:1.6px solid var(--line);background:var(--inp);color:var(--tx);font:inherit;font-size:16px;padding:0 50px;outline:none;transition:.25s}
.f input:focus{border-color:var(--cy);box-shadow:0 0 0 4px rgba(%%P1RGB%%,.18),0 0 20px rgba(%%P1RGB%%,.2)}
.f .i{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:16px;font-size:20px}
.f .e{position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:8px;background:none;border:0;font-size:20px;cursor:pointer;padding:8px}
.err{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(251,113,133,.12);border:1.5px solid var(--err);color:var(--err);font-size:14px;font-weight:700}
.go{position:relative;overflow:hidden;margin-top:20px;width:100%;height:60px;border:0;border-radius:20px;color:#fff;font:inherit;font-size:16px;font-weight:800;letter-spacing:.6px;cursor:pointer;background:linear-gradient(90deg,%%P1%%,%%P2%% 70%,%%P3%%);box-shadow:0 12px 28px rgba(%%P2RGB%%,.4),0 0 22px rgba(%%P1RGB%%,.22);transition:transform .15s}
.go:active{transform:scale(.97)}
.go::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-150%) skewX(-20deg);animation:sh 3s infinite}
@keyframes sh{to{transform:translateX(350%) skewX(-20deg)}}
.go.ld{pointer-events:none;opacity:.85}.go.ld span::before{content:"";display:inline-block;width:16px;height:16px;margin-inline-end:10px;vertical-align:-3px;border:2.5px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.note{text-align:center;color:var(--mut);font-size:12px;margin:14px 0 0}
.chips{display:flex;gap:8px;margin-top:14px}
.chips div{flex:1;text-align:center;padding:11px 4px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--mut)}
.chips b{display:block;font-size:18px;margin-bottom:3px}

.seg{display:flex;gap:6px;padding:5px;margin:14px 0 4px;border-radius:20px;background:var(--inp);border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;font-weight:800;padding:11px 4px;border-radius:15px;cursor:pointer;transition:.25s;display:flex;flex-direction:column;align-items:center;gap:3px}
.seg button b{font-size:18px;font-weight:400}
.seg button.on{color:#fff;background:linear-gradient(90deg,%%P1%%,%%P2%%);box-shadow:0 6px 16px rgba(%%P2RGB%%,.4)}
.pn{display:none;animation:up .4s both}.pn.on{display:block}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px!important;letter-spacing:4px;text-align:center;text-transform:uppercase;direction:ltr;padding:0 56px!important;font-weight:800}
.rem{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--mut);font-weight:700;cursor:pointer}
.rem input{width:18px;height:18px;accent-color:var(--cy)}
.qb{position:relative;margin-top:16px;aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:#000;border:1.6px solid var(--line);display:grid;place-items:center}
.qb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.qb.live video{display:block}
.qb .ph{font-size:64px;opacity:.6}.qb.live .ph{display:none}
.qb .fr{position:absolute;inset:18%;border-radius:18px;border:3px solid var(--gold);box-shadow:0 0 0 999px rgba(0,0,0,.35);display:none}
.qb.live .fr{display:block}
.qb .ln{position:absolute;left:18%;right:18%;height:2px;background:var(--cy);box-shadow:0 0 12px var(--cy);top:20%;animation:sc 2s ease-in-out infinite alternate;display:none}
.qb.live .ln{display:block}
@keyframes sc{to{top:78%}}
.row{display:flex;gap:10px;margin-top:12px}
.sec{flex:1;height:50px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.msg{margin-top:12px;text-align:center;font-size:12.5px;line-height:1.7;color:var(--mut)}
.trial{display:block;margin-top:12px;text-align:center;text-decoration:none;color:var(--gold);border:1.5px dashed var(--gold);border-radius:16px;padding:13px;font-size:14px;font-weight:800}

/* ===== تصميم مدمج: كل شيء في شاشة واحدة ===== */
body{min-height:100vh;min-height:100dvh;align-items:center;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
.w{max-width:400px;display:flex;flex-direction:column}
.top{margin-bottom:10px}
.hero{display:flex;align-items:center;gap:14px;text-align:start;margin-bottom:14px;direction:ltr;justify-content:center}
.logo{width:62px;height:62px;margin:0;flex:none;border-radius:20px;box-shadow:0 0 0 5px rgba(%%GOLDRGB%%,.10),0 8px 22px rgba(%%GOLDRGB%%,.3)}
.logo svg{width:36px;height:36px}
.hero>div:last-child,.hero .tx{text-align:start}
h1{font-size:34px;margin:0 0 3px;letter-spacing:-.5px}
.sub{font-size:13px;line-height:1.4;direction:rtl}
.gb{border-radius:24px}.gb>.in{border-radius:22.5px;padding:14px}
.seg{margin:0 0 2px;padding:4px;border-radius:16px;gap:4px}
.seg button{flex-direction:row;justify-content:center;gap:6px;padding:10px 2px;font-size:13.5px;border-radius:12px}
.seg button b{font-size:16px}
.hint{margin:10px 0 0;padding:8px 11px;font-size:12.5px;line-height:1.5;border-radius:12px}
label{margin:10px 0 5px;font-size:12.5px}
.f input{height:48px;border-radius:14px;font-size:15px}
.f .i{font-size:18px}
.code{font-size:20px!important;letter-spacing:3px}
.rem{margin-top:10px;font-size:12.5px}
.go{margin-top:12px;height:50px;border-radius:15px;font-size:15px}
.err{margin:10px 0 0;padding:9px 12px;font-size:13px;border-radius:12px}
.qb{margin-top:10px;aspect-ratio:auto;height:150px;border-radius:16px}
.qb .ph{font-size:46px}
.row{margin-top:10px;gap:8px}.sec{height:44px;border-radius:13px;font-size:12.5px}
.msg{margin-top:8px;font-size:12px;line-height:1.5}
.trial{margin-top:10px;padding:10px;font-size:13px;border-radius:13px}
.foot{margin-top:10px;font-size:10.5px;letter-spacing:.3px}
@media (max-height:640px){.hero{margin-bottom:8px}.logo{width:50px;height:50px}.logo svg{width:28px;height:28px}h1{font-size:28px}.hint{display:none}.qb{height:120px}}

/* ===== أحجام أكبر + شعار 🚀 ===== */
body{padding:14px}
.w{max-width:420px}
.top{margin-bottom:12px}
.hero{flex-direction:column;gap:0;direction:rtl;text-align:center;margin-bottom:16px}
.hero .tx{text-align:center}
.logo{width:78px;height:78px;margin:0 auto 10px;border-radius:26px;box-shadow:0 0 0 7px rgba(%%GOLDRGB%%,.12),0 12px 30px rgba(%%GOLDRGB%%,.4);animation:fl 3s ease-in-out infinite}
.logo img{width:70%;height:70%;object-fit:contain;border-radius:12px}.rk{font-size:44px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
@keyframes fl{50%{transform:translateY(-5px)}}
h1{font-size:42px;margin:0 0 4px}
.sub{font-size:14.5px}
.gb>.in{padding:18px}
.seg{padding:5px;border-radius:18px}
.seg button{padding:13px 2px;font-size:15px;border-radius:14px}
.seg button b{font-size:19px}
.hint{margin-top:12px;padding:10px 13px;font-size:13.5px}
label{margin:13px 0 6px;font-size:13.5px}
.f input{height:56px;border-radius:17px;font-size:16px}
.f .i{font-size:20px}
.code{font-size:24px!important}
.rem{margin-top:12px;font-size:13.5px}
.go{margin-top:16px;height:58px;border-radius:18px;font-size:16.5px}
.qb{height:190px;border-radius:20px;margin-top:12px}
.sec{height:50px;font-size:13.5px;border-radius:15px}
.msg{font-size:12.5px}
.trial{padding:12px;font-size:14px}
.foot{margin-top:12px;font-size:11px}
@media (max-height:740px){.hero{margin-bottom:10px}.logo{width:60px;height:60px;margin-bottom:6px}.logo img{width:70%;height:70%;object-fit:contain;border-radius:12px}.rk{font-size:34px}h1{font-size:34px}.sub{font-size:13px}.f input{height:50px}.go{height:52px;margin-top:12px}.seg button{padding:10px 2px}.hint{padding:8px 11px;font-size:12.5px}.qb{height:150px}}
@media (max-height:620px){.hint{display:none}}

<body>
<canvas id="net"></canvas>
<div class="w">
 <div class="top">
  <div class="brand">⚡ %%BRANDA%% %%BRANDB%%<small>%%TAGLINE%%</small></div>
  <div class="btns"><div class="dot"><i></i><span data-k="online">متصل</span></div><button class="pill" id="lg" type="button">FR</button></div>
 </div>
 <div class="hero">
  <div class="logo">%%LOGO%%</div>
  
  <div class="tx"><h1>%%BRANDA%% <b>%%BRANDB%%</b></h1>
  <p class="sub" data-k="sub"></p></div>
 </div>
 <div class="gb" id="card"><div class="in">
  <div class="seg" id="seg">
   <button type="button" data-m="member"><b>👤</b><span data-k="tm"></span></button>
   <button type="button" data-m="voucher"><b>🎟</b><span data-k="tv"></span></button>
   <button type="button" data-m="qr"><b>📷</b><span data-k="tq"></span></button>
  </div>
  <form name="login" id="fm" action="$(link-login-only)" method="post" onSubmit="return KM()">
   <input type="hidden" name="dst" value="$(link-orig)"><input type="hidden" name="popup" value="true">
   <!--$(if error)--><div class="err" id="er">⚠ $(error)</div><!--$(endif)-->

   <div class="pn" id="pn-member">
    <div class="hint" data-k="hm"></div>
    <label for="u" data-k="user"></label>
    <div class="f"><span class="i">👤</span><input id="u" name="username" type="text" value="$(username)" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <label for="p" data-k="pass"></label>
    <div class="f"><span class="i">🔑</span><input id="p" name="password" type="password" autocomplete="current-password" data-ph="passph"><button class="e" id="eye" type="button">👁</button></div>
    <label class="rem"><input type="checkbox" id="rm"><span data-k="rem"></span></label>
   </div>

   <div class="pn" id="pn-voucher">
    <div class="hint" data-k="hv"></div>
    <label for="vc" data-k="vlabel"></label>
    <div class="f"><span class="i">🎟</span><input id="vc" class="code" type="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" inputmode="text" placeholder="••••••"><button class="e" id="paste" type="button">📋</button></div>
   </div>

   <div class="pn" id="pn-qr">
    <div class="hint" data-k="hq"></div>
    <div class="qb" id="qb"><video id="vd" playsinline muted></video><div class="ph">📷</div><div class="fr"></div><div class="ln"></div></div>
    <div class="row"><button class="sec" id="cam" type="button" data-k="qcam"></button><button class="sec" id="pic" type="button" data-k="qpic"></button></div>
    <input id="fl" type="file" accept="image/*" capture="environment" hidden>
    <div class="msg" id="qm" data-k="qhint"></div>
   </div>

   <button class="go" id="go" type="submit"><span data-k="go"></span></button>
  </form>
  <!--$(if trial == 'yes')--><a class="trial" href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)" data-k="trial"></a><!--$(endif)-->
  <!--$(if chap-id)-->
  <form name="sendin" action="$(link-login-only)" method="post"><input type="hidden" name="username"><input type="hidden" name="password"><input type="hidden" name="dst" value="$(link-orig)"><input type="hidden" name="popup" value="true"></form>
  <script src="/md5.js"></script>
  <script>function doLogin(){document.sendin.username.value=document.login.username.value;document.sendin.password.value=hexMD5('$(chap-id)'+document.login.password.value+'$(chap-challenge)');document.sendin.submit();return false}</script>
  <!--$(endif)-->
  
 </div></div>
 <div class="foot">🛡 <span data-k="note"></span> • © %%BRANDA%% %%BRANDB%%</div>
</div>

<script>
(function(){var c=document.getElementById("net"),x=c.getContext("2d"),W,H,N=[],K=[],M={x:-999,y:-999},P=1;
function rs(){W=innerWidth;H=innerHeight;c.width=W*P;c.height=H*P;x.setTransform(P,0,0,P,0,0);var n=Math.max(24,Math.min(Math.round(W*H/24000),50));N=[];for(var i=0;i<n;i++)N.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.45,vy:(Math.random()-.5)*.45,r:Math.random()*1.7+1,g:Math.random()<.12})}
var T0=0;function f(ts){requestAnimationFrame(f);if(document.hidden||ts-T0<33)return;T0=ts;var k="%%P1RGB%%",g="%%GOLDRGB%%",L=115,i,j;x.clearRect(0,0,W,H);

var mx=a.x-M.x,my=a.y-M.y,mq=mx*mx+my*my;if(mq<24000){x.strokeStyle="rgba("+g+","+(1-mq/24000)*.75+")";x.beginPath();x.moveTo(a.x,a.y);x.lineTo(M.x,M.y);x.stroke()}
x.fillStyle=a.g?"rgb("+g+")":"rgba("+k+",.9)";x.beginPath();x.arc(a.x,a.y,a.g?a.r+1:a.r,0,6.283);x.fill()}

}

addEventListener("resize",rs);addEventListener("mousemove",m);addEventListener("touchmove",m,{passive:true});rs();requestAnimationFrame(f)})();

<script>

mations", "qns": "Le scan par caméra n’est pas pris en charge ici.<br>Utilisez l’appareil photo du téléphone : le QR ouvrira cette page automatiquement.", "qsec": "La caméra exige une connexion sécurisée.<br>Utilisez « Scanner une photo » ou l’appareil photo du téléphone.", "qdeny": "Accès caméra refusé. Essayez « Scanner une photo ».", "qnone": "Aucun QR trouvé dans l’image.", "qok": "✅ Code lu, connexion…"}},h=document.documentElement,L="ar";try{L=localStorage.kl||L}catch(e){}

<script>
(function(){
/* ===== إعدادات ===== */
var VOUCHER_PASS="%%VPASS%%";   /* "same" = كلمة المرور = الكود (Mikhmon/اليوزر مانجر vc) | "empty" = بدون كلمة مرور */
var AUTO_SUBMIT_URL=true;  /* دخول تلقائي عند فتح الرابط ?code=XXXX */
/* ================== */
var $=function(i){return document.getElementById(i)},g=$("go"),w=$("card"),fm=$("fm"),M="%%DEFTAB%%",S=null,busy=0,det=null,tm=null;
var T=function(k){return window.KT?KT(k):k};
function st(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function mode(m){M=m;stopCam();
 document.querySelectorAll("#seg button").forEach(function(b){b.classList.toggle("on",b.dataset.m==m)});
 ["voucher","member","qr"].forEach(function(x){$("pn-"+x).classList.toggle("on",x==m)});
 g.style.display=m=="qr"?"none":""}
document.querySelectorAll("#seg button").forEach(function(b){b.onclick=function(){mode(b.dataset.m)}});
$("eye").onclick=function(){var p=$("p");p.type=p.type=="password"?"text":"password"};
$("vc").addEventListener("input",function(){this.value=this.value.replace(/\s+/g,"").toUpperCase()});
$("paste").onclick=function(){if(navigator.clipboard&&navigator.clipboard.readText)navigator.clipboard.readText().then(function(t){$("vc").value=(t||"").trim().toUpperCase();$("vc").focus()}).catch(function(){$("vc").focus()});else $("vc").focus()};
/* تجهيز الحقول الحقيقية (username/password) قبل الإرسال */
function fill(){var u=$("u"),p=$("p");
 if(M=="voucher"){var c=$("vc").value.trim();u.value=c;p.value=VOUCHER_PASS=="same"?c:""}
 return !!u.value}
window.KM=function(){if(busy)return false;
 if(!fill()){w.classList.remove("shk");void w.offsetWidth;w.classList.add("shk");try{navigator.vibrate(120)}catch(e){}return false}
 if(M=="member"){if($("rm").checked){ss("kmu",$("u").value);ss("kmp",$("p").value)}else{ss("kmu","");ss("kmp","")}}
 busy=1;g.style.display="";g.classList.add("ld");g.firstChild.textContent=KL()=="ar"?"جاري الاتصال...":"Connexion...";
 if(window.doLogin)return doLogin();return true};
function go(){g.style.display="";if(fm.requestSubmit)fm.requestSubmit(g);else{if(KM())fm.submit()}}
/* ===== تحليل محتوى QR / الرابط ===== */
function parse(t){t=(t||"").trim();if(!t)return null;var u,p,m;
 try{var q=new URL(t,location.href).searchParams;
  u=q.get("username")||q.get("user")||q.get("code")||q.get("voucher")||q.get("u");p=q.get("password")||q.get("pass")||q.get("pwd")||q.get("p")}catch(e){}
 if(!u&&(m=t.match(/(?:username|user|code|voucher)=([^&\s]+)/i))){u=decodeURIComponent(m[1]);m=t.match(/(?:password|pass|pwd)=([^&\s]+)/i);if(m)p=decodeURIComponent(m[1])}
 if(!u){if(/^[^\s:|]+[:|][^\s]+$/.test(t)&&!/^https?:/i.test(t)){var a=t.split(/[:|]/);u=a[0];p=a.slice(1).join(":")}else if(!/\s/.test(t)&&!/^https?:/i.test(t))u=t}
 return u?{u:u,p:p}:null}
function apply(r){if(!r)return false;
 if(r.p&&r.p!==r.u){mode("member");$("u").value=r.u;$("p").value=r.p}else{mode("voucher");$("vc").value=r.u.toUpperCase()}
 return true}
function done(txt){stopCam();var r=parse(txt);if(!r){$("qm").innerHTML=T("qnone");return}
 apply(r);var m=$("qm");if(M=="qr")m.innerHTML=T("qok");
 $("pn-"+M).classList.add("on");setTimeout(go,350)}
/* ===== كاميرا QR (BarcodeDetector) ===== */
function stopCam(){if(tm){clearInterval(tm);tm=null}if(S){S.getTracks().forEach(function(t){t.stop()});S=null}$("qb").classList.remove("live")}
function hasDet(){if(!("BarcodeDetector" in window))return false;if(!det)try{det=new BarcodeDetector({formats:["qr_code"]})}catch(e){return false}return true}
$("cam").onclick=function(){var m=$("qm");
 if(S){stopCam();return}
 if(!hasDet()){m.innerHTML=T("qns");return}
 if(!window.isSecureContext||!navigator.mediaDevices){m.innerHTML=T("qsec");return}
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}).then(function(s){S=s;var v=$("vd");v.srcObject=s;v.play();$("qb").classList.add("live");m.innerHTML=T("qhint");
  tm=setInterval(function(){if(v.readyState<2)return;det.detect(v).then(function(r){if(r&&r.length)done(r[0].rawValue)}).catch(function(){})},250)}).catch(function(){m.innerHTML=T("qdeny")})};
$("pic").onclick=function(){$("fl").click()};
$("fl").onchange=function(){var f=this.files&&this.files[0],m=$("qm");this.value="";if(!f)return;
 if(!hasDet()){m.innerHTML=T("qns");return}
 (window.createImageBitmap?createImageBitmap(f):Promise.reject()).then(function(b){return det.detect(b)}).then(function(r){if(r&&r.length)done(r[0].rawValue);else m.innerHTML=T("qnone")}).catch(function(){m.innerHTML=T("qnone")})};
/* ===== تهيئة: رابط ?code= ← آخر وضع ← خطأ ===== */
var hasErr=!!$("er"),pre=$("u").value,fromUrl=parse(location.search?location.href:"");
if(st("kmu")){$("u").value=pre||st("kmu");$("p").value=st("kmp")||"";$("rm").checked=true}
mode(M);
if(fromUrl&&!hasErr){apply(fromUrl);if(AUTO_SUBMIT_URL)setTimeout(go,700)}
if(hasErr){w.classList.add("shk");try{navigator.vibrate(200)}catch(e){}}
w.addEventListener("pointermove",function(e){if(e.pointerType!="mouse")return;var r=w.getBoundingClientRect();w.style.transform="perspective(900px) rotateX("+(-(e.clientY-r.top)/r.height+.5)*6+"deg) rotateY("+((e.clientX-r.left)/r.width-.5)*8+"deg)"});
w.addEventListener("pointerleave",function(){w.style.transform=""});
addEventListener("pagehide",stopCam);
})();
</script>
