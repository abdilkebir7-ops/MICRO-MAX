name: MICRO-MAX Real Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: micromax-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build Signed APK + AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================
      # VERIFY ANDROID SDK
      # ==========================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ANDROID SDK CHECK"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo ""
          echo "Checking adb..."
          "$ANDROID_HOME/platform-tools/adb" version

          echo ""
          echo "Checking apksigner..."
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" version

          echo ""
          echo "Android SDK OK"

      # ==========================================
      # CHECK ANDROID PROJECT
      # ==========================================
      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android project..."

          test -f gradlew
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

          chmod +x gradlew

          echo "Android project OK"

      # ==========================================
      # PREPARE KEYSTORE
      # ==========================================
      - name: Prepare Keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MICROMAX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          echo "Preparing release keystore..."

          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "ERROR: MICROMAX_KEYSTORE_BASE64 is missing"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/micromax"

          KEYSTORE="$RUNNER_TEMP/micromax/micromax-upload.jks"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "MICROMAX_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Keystore prepared successfully."

      # ==========================================
      # CONFIGURE BACKEND
      # ==========================================
      - name: Configure Backend
        shell: bash
        env:
          API_URL: ${{ secrets.MICROMAX_API_BASE_URL }}
        run: |
          set -euo pipefail

          echo "Configuring backend..."

          if [ -z "${API_URL:-}" ]; then
            echo "MICROMAX_API_BASE_URL is not configured."
            echo "Build will continue using the application's default URL."
            exit 0
          fi

          API_URL_CLEAN="$(printf '%s' "$API_URL" | tr -d '\r\n' | xargs)"

          case "$API_URL_CLEAN" in
            https://*)
              echo "Backend HTTPS URL accepted."
              ;;
            *)
              echo "ERROR: MICROMAX_API_BASE_URL must use HTTPS."
              exit 1
              ;;
          esac

          printf 'MICROMAX_API_BASE_URL=%s\n' "$API_URL_CLEAN" >> "$GITHUB_ENV"

          echo "Backend configured successfully."

      # ==========================================
      # CONFIGURE GOOGLE CLIENT ID
      # ==========================================
      - name: Configure Google Client ID
        shell: bash
        env:
          GOOGLE_ID: ${{ secrets.MICROMAX_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail

          echo "Configuring Google Client ID..."

          if [ -z "${GOOGLE_ID:-}" ]; then
            echo "Google Client ID is not configured."
            echo "Build will continue using the application default."
            exit 0
          fi

          # Remove Windows CR/LF and surrounding spaces.
          GOOGLE_ID_CLEAN="$(printf '%s' "$GOOGLE_ID" | tr -d '\r\n' | xargs)"

          # Validate Google Web Client ID.
          if [[ ! "$GOOGLE_ID_CLEAN" =~ ^[0-9]+-[A-Za-z0-9._-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "WARNING: MICROMAX_GOOGLE_WEB_CLIENT_ID format is invalid."
            echo "Build will continue without overriding the default."
            exit 0
          fi

          # IMPORTANT:
          # Use printf instead of echo so GitHub Actions receives
          # exactly one valid GITHUB_ENV line.
          printf 'MICROMAX_GOOGLE_WEB_CLIENT_ID=%s\n' "$GOOGLE_ID_CLEAN" >> "$GITHUB_ENV"

          echo "Google Client ID configured successfully."

      # ==========================================
      # CHECK SIGNING SECRETS
      # ==========================================
      - name: Check Signing Secrets
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Checking signing configuration..."

          if [ -z "${STORE_PASSWORD:-}" ]; then
            echo "ERROR: MICROMAX_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: MICROMAX_KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: MICROMAX_KEY_PASSWORD is missing."
            exit 1
          fi

          echo "Signing secrets OK."

      # ==========================================
      # CHECK JAVA + GRADLE
      # ==========================================
      - name: Check Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          ./gradlew --version

      # ==========================================
      # CLEAN PROJECT
      # ==========================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning project..."

          ./gradlew clean \
            --no-daemon \
            --stacktrace

          echo "Clean completed."

      # ==========================================
      # BUILD SIGNED APK
      # ==========================================
      - name: Build signed APK
        shell: bash
        env:
          MICROMAX_KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          MICROMAX_KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          MICROMAX_KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING SIGNED APK"
          echo "=========================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo "Signed APK build completed."

      # ==========================================
      # BUILD SIGNED AAB
      # ==========================================
      - name: Build signed AAB
        shell: bash
        env:
          MICROMAX_KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          MICROMAX_KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          MICROMAX_KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING SIGNED AAB"
          echo "=========================================="

          ./gradlew \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace

          echo "Signed AAB build completed."

      # ==========================================
      # CHECK RELEASE FILES
      # ==========================================
      - name: Check release files
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          echo "Checking APK..."
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Available build outputs:"
            find app/build/outputs -type f -print || true
            exit 1
          fi

          echo "Checking AAB..."
          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB was not generated."
            echo ""
            echo "Available build outputs:"
            find app/build/outputs -type f -print || true
            exit 1
          fi

          mkdir -p release

          cp "$APK" release/MICRO-MAX-release.apk
          cp "$AAB" release/MICRO-MAX-release.aab

          echo ""
          echo "=========================================="
          echo "RELEASE FILES"
          echo "=========================================="

          ls -lh release/

      # ==========================================
      # VERIFY APK SIGNATURE
      # ==========================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          echo "Verifying APK signature..."

          "$APKSIGNER" verify \
            --verbose \
            release/MICRO-MAX-release.apk

          echo "APK signature verified successfully."

      # ==========================================
      # VERIFY AAB SIGNATURE
      # ==========================================
      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying AAB signature..."

          jarsigner \
            -verify \
            -verbose \
            -certs \
            release/MICRO-MAX-release.aab

          echo "AAB signature verified successfully."

      # ==========================================
      # GENERATE SHA256
      # ==========================================
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          cd release

          echo "Generating SHA256 checksums..."

          sha256sum \
            MICRO-MAX-release.apk \
            MICRO-MAX-release.aab \
            > SHA256SUMS.txt

          echo ""
          echo "=========================================="
          echo "SHA256"
          echo "=========================================="

          cat SHA256SUMS.txt

      # ==========================================
      # FINAL RELEASE CHECK
      # ==========================================
      - name: Final release check
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL MICRO-MAX RELEASE CHECK"
          echo "=========================================="

          test -s release/MICRO-MAX-release.apk
          test -s release/MICRO-MAX-release.aab
          test -s release/SHA256
