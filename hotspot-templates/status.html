<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MICRO-MAX Status</title><style>:root{--p:#22d3ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:linear-gradient(145deg,#020617,#0f172a);color:#f8fafc;padding:20px}.card{width:min(500px,100%);padding:28px;border:1px solid #ffffff22;border-radius:28px;background:#ffffff0d;backdrop-filter:blur(20px)}h1{margin:0 0 5px}.muted{color:#94a3b8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.item{padding:15px;border-radius:16px;background:#0004}.k{color:#94a3b8;font-size:12px}.v{font-size:17px;font-weight:800;margin-top:5px}a{color:var(--p)}</style></head><body><main class="card"><h1>MICRO-MAX</h1><div class="muted">حالة الاتصال</div><div class="grid"><div class="item"><div class="k">المستخدم</div><div class="v">$(username)</div></div><div class="item"><div class="k">العنوان</div><div class="v">$(ip)</div></div><div class="item"><div class="k">التحميل</div><div class="v">$(bytes-out-nice)</div></div><div class="item"><div class="k">الرفع</div><div class="v">$(bytes-in-nice)</div></div><div class="item"><div class="k">الوقت المتبقي</div><div class="v">$(session-time-left)</div></div><div class="item"><div class="k">الجلسة</div><div class="v">$(uptime)</div></div></div><a href="$(link-logout)">تسجيل الخروج</a></main></body></html>
