name: Build MICRO-MAX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MICRO-MAX APK
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: "17"

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # لا يوجد cache: gradle هنا
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 4. Install Android SDK components
      # ============================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 5. Find Android project
      #
      # يدعم:
      # - مشروع Android في جذر المستودع
      # - مشروع داخل مجلد
      # - مشروع داخل ZIP
      # ============================================================
      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Detecting Android project"
          echo "========================================"

          PROJECT_DIR=""

          # --------------------------------------------------------
          # أولاً: هل المشروع موجود مباشرة؟
          # --------------------------------------------------------
          if [ -f "./settings.gradle" ] || \
             [ -f "./settings.gradle.kts" ] || \
             [ -f "./gradlew" ]; then

            PROJECT_DIR="$GITHUB_WORKSPACE"

          else

            # ------------------------------------------------------
            # البحث عن مشروع Android موجود داخل مجلد
            # ------------------------------------------------------
            FOUND_SETTINGS="$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name "settings.gradle" -o -name "settings.gradle.kts" \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              -print -quit || true)"

            if [ -n "$FOUND_SETTINGS" ]; then
              PROJECT_DIR="$(dirname "$FOUND_SETTINGS")"
            fi
          fi

          # --------------------------------------------------------
          # إذا لم نجد مشروعًا، ابحث عن ZIP
          # --------------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              -print -quit || true)"

            if [ -n "$ZIP_FILE" ]; then

              echo "ZIP found:"
              echo "$ZIP_FILE"

              mkdir -p "$GITHUB_WORKSPACE/extracted"

              unzip -q "$ZIP_FILE" \
                -d "$GITHUB_WORKSPACE/extracted"

              FOUND_SETTINGS="$(find "$GITHUB_WORKSPACE/extracted" \
                -type f \
                -name "settings.gradle" -o -name "settings.gradle.kts" \
                -not -path "*/.gradle/*" \
                -not -path "*/build/*" \
                -print -quit || true)"

              if [ -n "$FOUND_SETTINGS" ]; then
                PROJECT_DIR="$(dirname "$FOUND_SETTINGS")"
              fi
            fi
          fi

          # --------------------------------------------------------
          # فشل واضح إذا لم نجد المشروع
          # --------------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            echo "::error::Android project was not found."

            echo ""
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -not -path "*/.git/*" \
              | sort \
              | head -200

            exit 1
          fi

          echo ""
          echo "========================================"
          echo " Android project found"
          echo "========================================"
          echo "$PROJECT_DIR"
          echo ""

          # --------------------------------------------------------
          # حفظ المتغير للخطوات التالية
          # --------------------------------------------------------
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 6. Verify Gradle project
      # ============================================================
      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo " Gradle project"
          echo "========================================"

          echo "Project:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "::error::settings.gradle or settings.gradle.kts was not found."
            exit 1
          fi

          if [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then
            echo "::error::Root build.gradle or build.gradle.kts was not found."
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            echo "::error::gradlew was not found."
            echo "The Android project must contain the Gradle wrapper."
            exit 1
          fi

          chmod +x gradlew

          echo ""
          echo "Gradle wrapper:"
          ./gradlew --version

      # ============================================================
      # 7. Verify app module
      # ============================================================
      - name: Verify Android app module
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -d "app" ]; then
            echo "::error::The app module directory was not found."

            echo ""
            echo "Available directories:"
            find . -maxdepth 2 -type d \
              -not -path "./.gradle*" \
              -not -path "./build*" \
              | sort

            exit 1
          fi

          if [ ! -f "app
