name: MICRO-MAX APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MICRO-MAX APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project
        run: |
          test -f gradlew
          test -f app/build.gradle.kts
          chmod +x gradlew

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure API
        env:
          API_URL: ${{ secrets.MICROMAX_API_BASE_URL }}
        run: |
          if [ -n "$API_URL" ]; then
            echo "MICROMAX_API_BASE_URL=$API_URL" >> "$GITHUB_ENV"
          else
            echo "MICROMAX_API_BASE_URL=https://api.example.com" >> "$GITHUB_ENV"
          fi

      - name: Configure Google Client ID
        env:
          GOOGLE_ID: ${{ secrets.MICROMAX_GOOGLE_WEB_CLIENT_ID }}
        run: |
          echo "MICROMAX_GOOGLE_WEB_CLIENT_ID=$GOOGLE_ID" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          set -e

          mkdir -p download

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK"
          test -f "$APK"

          cp "$APK" download/MICRO-MAX.apk

          ls -lh download/MICRO-MAX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-APK
          path: download/MICRO-MAX.apk
          if-no-files-found: error
          retention-days: 30
