<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MICRO-MAX HotSpot</title><style>:root{--p:#22d3ee;--bg:#07111f;--card:rgba(255,255,255,.08);--text:#f8fafc;--muted:#94a3b8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:radial-gradient(circle at 20% 10%,#164e63,transparent 35%),linear-gradient(145deg,#020617,#0f172a);color:var(--text);padding:20px}.card{width:min(430px,100%);padding:28px;border:1px solid rgba(255,255,255,.14);border-radius:28px;background:var(--card);backdrop-filter:blur(20px);box-shadow:0 25px 80px #0008}.brand{font-size:28px;font-weight:900;margin-bottom:6px}.muted{color:var(--muted);font-size:13px;margin-bottom:22px}input{width:100%;padding:15px;margin:7px 0;border-radius:14px;border:1px solid #ffffff22;background:#0004;color:white}button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:14px;background:var(--p);color:#001018;font-weight:900;font-size:15px}.error{color:#fb7185;margin:10px 0}a{color:var(--p)} </style></head><body><main class="card"><div class="brand">MICRO-MAX</div><div class="muted">بوابة Wi‑Fi • اتصال سريع وآمن</div><div class="error">$(error)</div><form action="$(link-login-only)" method="post"><input type="hidden" name="dst" value="$(link-orig)"><input name="username" autocomplete="username" placeholder="اسم المستخدم" required><input type="password" name="password" autocomplete="current-password" placeholder="كلمة المرور" required><button type="submit">دخول إلى الإنترنت</button></form></main><script>(function(){try{var q=new URLSearchParams(location.search),u=q.get('username'),p=q.get('password'),f=document.forms[0];if(!u||!p||!f)return;f.username.value=u;f.password.value=p;if(q.get('auto')==='1'&&!sessionStorage.getItem('mmauto')){sessionStorage.setItem('mmauto','1');f.submit();}}catch(e){}})();</script></body></html>
