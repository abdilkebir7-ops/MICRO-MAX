name: Build MICRO-MAX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MICRO-MAX APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 4. Install Android SDK
      # ============================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 5. Install unzip
      # ============================================================
      - name: Install unzip
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip

      # ============================================================
      # 6. Find ZIP
      # ============================================================
      - name: Find MICRO-MAX ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Repository contents"
          echo "=========================================="

          find . -maxdepth 3 -type f -print | sort

          ZIP_FILE=""

          ZIP_FILE="$(find . \
            -maxdepth 3 \
            -type f \
            \( \
              -iname 'MICRO-MAX*.zip' \
              -o \
              -iname 'micro-max*.zip' \
            \) \
            -print -quit || true)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . \
              -maxdepth 3 \
              -type f \
              -iname '*.zip' \
              -print -quit || true)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found."
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ============================================================
      # 7. Extract ZIP
      # ============================================================
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/micromax-project"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo ""
          echo "=========================================="
          echo "Extracted project"
          echo "=========================================="

          find "$EXTRACT_DIR" \
            -maxdepth 5 \
            -type f \
            -print | sort | head -300

      # ============================================================
      # 8. Detect real Android project
      # ============================================================
      - name: Detect Android project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/micromax-project"

          SETTINGS_FILE="$(
            find "$ROOT" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle or settings.gradle.kts was not found."
            echo ""
            echo "ZIP contents:"
            find "$ROOT" -maxdepth 7 -print | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo ""
          echo "=========================================="
          echo "ANDROID PROJECT FOUND"
          echo "=========================================="
          echo "Settings:"
          echo "$SETTINGS_FILE"
          echo ""
          echo "Project:"
          echo "$PROJECT_DIR"
          echo "=========================================="

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 9. Verify Gradle wrapper
      # ============================================================
      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 2 -type f -print | sort

          if [ ! -f "./gradlew" ]; then
            echo "::error::gradlew was not found."
            echo ""
            echo "Expected:"
            echo "$PROJECT_DIR/gradlew"
            exit 1
          fi

          chmod +x ./gradlew

          echo ""
          echo "Gradle wrapper:"
          ls -lh ./gradlew

      # ============================================================
      # 10. Verify Gradle
      # ============================================================
      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew --version

      # ============================================================
      # 11. Show Gradle tasks
      # ============================================================
      - name: Check Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew tasks \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ============================================================
      # 12. Build APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo ""
          echo "=========================================="
          echo "BUILDING MICRO-MAX"
          echo "=========================================="

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode=all

      # ============================================================
      # 13. Verify APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK_DIR="app/build/outputs/apk/debug"

          echo ""
          echo "=========================================="
          echo "APK OUTPUT"
          echo "=========================================="

          if ! find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit | grep -q .; then

            echo "::error::APK was not generated."

            echo ""
            echo "Build outputs:"
            find app/build/outputs \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

      # ============================================================
      # 14. Prepare artifact
      # ============================================================
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/micromax-apk"

          find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            -exec cp {} "$RUNNER_TEMP/micromax-apk/" \;

          echo ""
          echo "Artifact:"
          ls -lh "$RUNNER_TEMP/micromax-apk"

      # ============================================================
      # 15. Upload APK
      # ============================================================
      - name: Upload MICRO-MAX APK
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-debug
          path: ${{ runner.temp }}/micromax-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 16. Success
      # ============================================================
      - name: Build successful
        if: success()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " MICRO-MAX APK BUILD SUCCESSFUL "
          echo "=========================================="
          echo ""
          echo "Go to:"
          echo "Actions -> MICRO-MAX-debug"
          echo ""
          echo "Download the generated APK."
