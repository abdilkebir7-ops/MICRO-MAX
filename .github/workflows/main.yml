name: MICRO-MAX Real Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: micromax-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # =========================================================
      # 3. Gradle
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # =========================================================
      # 4. Check Android project
      # =========================================================
      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android project..."

          test -f "./gradlew"
          test -f "./settings.gradle" \
            || test -f "./settings.gradle.kts"

          test -d "./app"

          test -f "./app/build.gradle" \
            || test -f "./app/build.gradle.kts"

          chmod +x ./gradlew

          echo ""
          echo "Project structure:"
          ls -la

          echo ""
          echo "App directory:"
          ls -la app

      # =========================================================
      # 5. Android SDK
      # =========================================================
      # GitHub ubuntu-latest already contains Android SDK.
      # We intentionally DO NOT run android-actions/setup-android
      # because sdkmanager was the previous point of failure.
      # =========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          if [ -n "${ANDROID_HOME:-}" ]; then
            SDK_DIR="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK_DIR="$ANDROID_SDK_ROOT"
          else
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "Using Android SDK: $SDK_DIR"

          test -d "$SDK_DIR"

          echo ""
          echo "Installed SDK platforms:"
          ls -la "$SDK_DIR/platforms" || true

          echo ""
          echo "Installed build tools:"
          ls -la "$SDK_DIR/build-tools" || true

          echo ""
          echo "SDK verification completed."

      # =========================================================
      # 6. Prepare signing keystore
      # =========================================================
      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MICROMAX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "ERROR: MICROMAX_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          KEYSTORE_DIR="$RUNNER_TEMP/micromax"
          KEYSTORE_FILE="$KEYSTORE_DIR/micromax-upload.jks"

          mkdir -p "$KEYSTORE_DIR"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "MICROMAX_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          echo "Keystore prepared successfully."

      # =========================================================
      # 7. Backend configuration
      # =========================================================
      - name: Configure Backend
        shell: bash
        env:
          API_URL: ${{ secrets.MICROMAX_API_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${API_URL:-}" ]; then
            echo "ERROR: MICROMAX_API_BASE_URL is missing."
            exit 1
          fi

          case "$API_URL" in
            https://*)
              echo "Backend HTTPS: OK"
              ;;
            *)
              echo "ERROR: Backend URL must start with https://"
              exit 1
              ;;
          esac

          echo "MICROMAX_API_BASE_URL=$API_URL" >> "$GITHUB_ENV"

      # =========================================================
      # 8. Google Client ID
      # =========================================================
      - name: Configure Google Client ID
        shell: bash
        env:
          GOOGLE_ID: ${{ secrets.MICROMAX_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_ID:-}" ]; then
            echo "ERROR: MICROMAX_GOOGLE_WEB_CLIENT_ID is missing."
            exit 1
          fi

          echo "MICROMAX_GOOGLE_WEB_CLIENT_ID=$GOOGLE_ID" >> "$GITHUB_ENV"

          echo "Google Client ID configured."

      # =========================================================
      # 9. Check signing secrets
      # =========================================================
      - name: Check signing secrets
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${STORE_PASSWORD:-}" ]; then
            echo "ERROR: MICROMAX_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: MICROMAX_KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: MICROMAX_KEY_PASSWORD is missing."
            exit 1
          fi

          echo "Signing secrets: OK"

      # =========================================================
      # 10. Java / Gradle diagnostics
      # =========================================================
      - name: Check Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          ./gradlew --version

      # =========================================================
      # 11. Clean
      # =========================================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning project..."

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # =========================================================
      # 12. Build signed APK
      # =========================================================
      - name: Build signed APK
        shell: bash
        env:
          MICROMAX_KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          MICROMAX_KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          MICROMAX_KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING SIGNED APK"
          echo "======================================"

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

      # =========================================================
      # 13. Build signed AAB
      # =========================================================
      - name: Build signed AAB
        shell: bash
        env:
          MICROMAX_KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          MICROMAX_KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          MICROMAX_KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING SIGNED AAB"
          echo "======================================"

          ./gradlew :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            --info

      # =========================================================
      # 14. Locate release files
      # =========================================================
      - name: Check release files
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          echo "Checking APK..."
          test -f "$APK"

          echo "Checking AAB..."
          test -f "$AAB"

          mkdir -p release

          cp "$APK" \
            "release/MICRO-MAX-release.apk"

          cp "$AAB" \
            "release/MICRO-MAX-release.aab"

          echo ""
          echo "Release files:"
          ls -lh release/

      # =========================================================
      # 15. Verify APK signature
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK_SIGNER=""

          if [ -n "${ANDROID_HOME:-}" ]; then
            APK_SIGNER=$(find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              2>/dev/null \
              | sort -V \
              | tail -n 1 || true)
          fi

          if [ -z "$APK_SIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "Using:"
          echo "$APK_SIGNER"

          "$APK_SIGNER" verify \
            --verbose \
            release/MICRO-MAX-release.apk

      # =========================================================
      # 16. Verify AAB signature
      # =========================================================
      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail

          jarsigner \
            -verify \
            -verbose \
            -certs \
            release/MICRO-MAX-release.aab

          echo "AAB signature verification completed."

      # =========================================================
      # 17. Generate checksums
      # =========================================================
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          cd release

          sha256sum \
            MICRO-MAX-release.apk \
            MICRO-MAX-release.aab \
            > SHA256SUMS.txt

          echo ""
          cat SHA256SUMS.txt

      # =========================================================
      # 18. Final release check
      # =========================================================
      - name: Final release check
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "MICRO-MAX RELEASE CHECK"
          echo "======================================"

          test -f release/MICRO-MAX-release.apk
          test -f release/MICRO-MAX-release.aab
          test -f release/SHA256SUMS.txt

          APK_SIZE=$(stat -c%s release/MICRO-MAX-release.apk)
          AAB_SIZE=$(stat -c%s release/MICRO-MAX-release.aab)

          echo "APK size: ${APK_SIZE} bytes"
          echo "AAB size: ${AAB_SIZE} bytes"

          if [ "$APK_SIZE" -lt 100000 ]; then
            echo "ERROR: APK is suspiciously small."
            exit 1
          fi

          if [ "$AAB_SIZE" -lt 100000 ]; then
            echo "ERROR: AAB is suspiciously small."
            exit 1
          fi

          echo ""
          echo "RELEASE CHECK PASSED."

      # =========================================================
      # 19. Upload artifacts
      # =========================================================
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-REAL-RELEASE
          path: release/
          if-no-files-found: error
          retention-days: 30
