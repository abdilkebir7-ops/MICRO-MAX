name: Build MICRO-MAX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MICRO-MAX APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. Java 17
      # IMPORTANT:
      # No Gradle cache here.
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 4. Install Android SDK components
      # Do NOT install the old "tools" package.
      # ============================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 5. Detect Android project
      # ============================================================
      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching for Android project..."
          echo "========================================"

          PROJECT_DIR=""

          # --------------------------------------------------------
          # First: check repository root
          # --------------------------------------------------------
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          fi

          # --------------------------------------------------------
          # Second
