name: MICRO-MAX Real Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Build Signed APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project
        run: |
          set -e
          test -f gradlew
          test -f app/build.gradle.kts
          chmod +x gradlew

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # إنشاء Keystore من GitHub Secret
      - name: Prepare Keystore
        env:
          KEYSTORE_B64: ${{ secrets.MICROMAX_KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_B64"

          mkdir -p "$RUNNER_TEMP/micromax"
          KEYSTORE="$RUNNER_TEMP/micromax/micromax-upload.jks"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "MICROMAX_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      # رابط Backend الحقيقي
      - name: Configure Backend
        env:
          API_URL: ${{ secrets.MICROMAX_API_BASE_URL }}
        run: |
          set -e

          test -n "$API_URL"

          case "$API_URL" in
            https://*)
              echo "Backend HTTPS OK"
              ;;
            *)
              echo "ERROR: Backend must use HTTPS"
              exit 1
              ;;
          esac

          echo "MICROMAX_API_BASE_URL=$API_URL" >> "$GITHUB_ENV"

      # Google Client ID
      - name: Configure Google
        env:
          GOOGLE_ID: ${{ secrets.MICROMAX_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -e

          test -n "$GOOGLE_ID"

          echo "MICROMAX_GOOGLE_WEB_CLIENT_ID=$GOOGLE_ID" >> "$GITHUB_ENV"

      # التحقق من مفاتيح التوقيع
      - name: Check Signing Secrets
        env:
          STORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "Signing configuration OK"

      # تنظيف
      - name: Clean
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # بناء النسخة الحقيقية
      - name: Build Real Release
        env:
          MICROMAX_KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          MICROMAX_KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          MICROMAX_KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -e

          ./gradlew \
            :app:assembleRelease \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace

      # التحقق من الملفات
      - name: Check Release Files
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          test -f "$APK"
          test -f "$AAB"

          mkdir -p download

          cp "$APK" download/MICRO-MAX-release.apk
          cp "$AAB" download/MICRO-MAX-release.aab

          ls -lh download/

      # التحقق من توقيع APK
      - name: Verify APK
        run: |
          apksigner verify \
            --verbose \
            download/MICRO-MAX-release.apk

      # التحقق من توقيع AAB
      - name: Verify AAB
        run: |
          jarsigner \
            -verify \
            -verbose \
            -certs \
            download/MICRO-MAX-release.aab

      # رفع الملفات
      - name: Upload Real Release
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-REAL-RELEASE
          path: download/
          if-no-files-found: error
          retention-days: 30
