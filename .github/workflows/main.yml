name: MICRO-MAX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MICRO-MAX APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Repository root ==="
          pwd
          echo

          echo "=== Root files ==="
          find . -maxdepth 2 -type f \
            -not -path './.git/*' \
            | sort | head -200
          echo

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "::error::settings.gradle.kts or settings.gradle was not found in repository root."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "::error::app/build.gradle.kts or app/build.gradle was not found."
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "::error::app/src/main/AndroidManifest.xml was not found."
            exit 1
          fi

          echo "Android project structure: OK"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Using repository Gradle Wrapper."
            ./gradlew --version
          else
            echo "::error::gradlew was not found."
            echo "The repository must contain the Gradle Wrapper files:"
            echo "  ./gradlew"
            echo "  ./gradle/wrapper/gradle-wrapper.properties"
            echo "  ./gradle/wrapper/gradle-wrapper.jar"
            exit 1
          fi

      - name: Check Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:tasks \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Building MICRO-MAX ==="
          echo

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Generated APK files ==="

          APK_COUNT="$(find app/build/outputs/apk/debug -type f -name '*.apk' 2>/dev/null | wc -l)"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK was generated."
            echo
            echo "Available build outputs:"
            find app/build/outputs -type f -print 2>/dev/null || true
            exit 1
          fi

          find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -exec ls -lh {} \;

      - name: Upload MICRO-MAX APK
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
