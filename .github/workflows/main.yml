name: MICRO-MAX Release AAB

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Build and sign the Play Store AAB"
        required: true
        default: true
        type: boolean

  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: micromax-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest

    # Release builds run manually with release=true,
    # or automatically when a version tag such as v2.16.1 is pushed.
    if: github.event_name == 'push' || inputs.release == true

    env:
      PROJECT_DIR: .
      JAVA_VERSION: "17"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/java/com/micromax/app/MainActivity.kt"

          chmod +x "$PROJECT_DIR/gradlew"

      - name: Prepare upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MICROMAX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: MICROMAX_KEYSTORE_BASE64 is missing"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: MICROMAX_KEYSTORE_PASSWORD is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: MICROMAX_KEY_ALIAS is missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: MICROMAX_KEY_PASSWORD is missing"
            exit 1
          }

          KEYSTORE_PATH="$RUNNER_TEMP/micromax-upload.jks"

          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          {
            echo "MICROMAX_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "MICROMAX_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MICROMAX_KEY_ALIAS=$KEY_ALIAS"
            echo "MICROMAX_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Release AAB
        shell: bash
        env:
          MICROMAX_API_BASE_URL: ${{ secrets.MICROMAX_API_BASE_URL }}
          MICROMAX_GOOGLE_WEB_CLIENT_ID: ${{ secrets.MICROMAX_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail

          test -n "$MICROMAX_API_BASE_URL" || {
            echo "ERROR: MICROMAX_API_BASE_URL is missing"
            exit 1
          }

          cd "$PROJECT_DIR"

          ./gradlew :app:bundleRelease \
            --stacktrace \
            --warning-mode all

      - name: Verify signed AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"

          test -s "$AAB"

          jarsigner -verify -verbose -certs "$AAB"

          echo "Signed AAB verified:"
          ls -lh "$AAB"

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-release-aab-${{ github.ref_name }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
          
