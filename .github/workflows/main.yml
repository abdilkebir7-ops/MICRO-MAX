name: MICRO-MAX Real Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Build Signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # 1. Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install Android SDK
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Check project
      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f gradlew

          chmod +x gradlew

          echo "Android project OK"

      # 6. Check Gradle
      - name: Check Gradle
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version

      # 7. Prepare signing keystore
      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MICROMAX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          mkdir -p "$RUNNER_TEMP/micromax"

          KEYSTORE_PATH="$RUNNER_TEMP/micromax/micromax-upload.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          keytool \
            -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "MICROMAX_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Keystore OK"

      # مهم:
      # لا نحتاج MICROMAX_API_BASE_URL
      # لا نحتاج MICROMAX_GOOGLE_WEB_CLIENT_ID
      #
      # app/build.gradle.kts عندك يحتوي على fallback
      # لذلك لن نفشل الـ build بسبب عدم وجود Backend.

      # 8. Clean
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain

      # 9. Build APK
      - name: Build signed APK
        shell: bash
        env:
          MICROMAX_KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          MICROMAX_KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          MICROMAX_KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING MICRO-MAX RELEASE APK"
          echo "======================================"

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain

      # 10. Build AAB
      - name: Build signed AAB
        shell: bash
        env:
          MICROMAX_KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          MICROMAX_KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          MICROMAX_KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING MICRO-MAX RELEASE AAB"
          echo "======================================"

          ./gradlew \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain

      # 11. Check files
      - name: Check release files
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          test -s "$APK"
          test -s "$AAB"

          mkdir -p release

          cp "$APK" \
            release/MICRO-MAX-release.apk

          cp "$AAB" \
            release/MICRO-MAX-release.aab

          ls -lh release/

      # 12. Verify APK
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -f "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            release/MICRO-MAX-release.apk

          echo "APK signature OK"

      # 13. Verify AAB
      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail

          jarsigner \
            -verify \
            -verbose \
            -certs \
            release/MICRO-MAX-release.aab

          echo "AAB signature OK"

      # 14. Checksums
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            release/MICRO-MAX-release.apk \
            release/MICRO-MAX-release.aab \
            > release/SHA256SUMS.txt

          cat release/SHA256SUMS.txt

      # 15. Mapping
      - name: Include mapping
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "app/build/outputs/mapping/release/mapping.txt" ]; then

            cp \
              app/build/outputs/mapping/release/mapping.txt \
              release/mapping.txt

            echo "mapping.txt included"

          else

            echo "No mapping.txt found"

          fi

      # 16. Final check
      - name: Final release check
        shell: bash
        run: |
          set -euo pipefail

          test -s release/MICRO-MAX-release.apk
          test -s release/MICRO-MAX-release.aab
          test -s release/SHA256SUMS.txt

          echo "======================================"
          echo "MICRO-MAX RELEASE READY"
          echo "======================================"

          ls -lah release/

      # 17. Upload
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-REAL-RELEASE
          path: release/
          if-no-files-found: error
          retention-days: 30
