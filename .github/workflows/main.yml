name: Build MICRO-MAX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MICRO-MAX APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 4. Install Android SDK components
      # ============================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 5. Install unzip
      # ============================================================
      - name: Install unzip
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip

      # ============================================================
      # 6. Find MICRO-MAX ZIP
      # ============================================================
      - name: Find MICRO-MAX ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Repository files ==="
          find . -maxdepth 3 -type f -print | sort

          ZIP_FILE=""

          # First: look specifically for MICRO-MAX ZIP files
          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -iname 'MICRO-MAX*.zip' -o -iname 'micro-max*.zip' \
            -print -quit || true)"

          # Second: fallback to any ZIP
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f \
              -iname '*.zip' \
              -print -quit || true)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file was found in the repository."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ============================================================
      # 7. Extract Android project
      # ============================================================
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/micromax-project"

          mkdir -p "$RUNNER_TEMP/micromax-project"

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" \
            -d "$RUNNER_TEMP/micromax-project"

          echo ""
          echo "=== Extracted files ==="
          find "$RUNNER_TEMP/micromax-project" \
            -maxdepth 5 \
            -type f \
            -print | sort | head -300

      # ============================================================
      # 8. Detect real Gradle project
      # ============================================================
      - name: Detect Android project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/micromax-project"

          echo "Searching for settings.gradle..."

          SETTINGS_FILE="$(
            find "$ROOT" \
              -type f \
              \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle or settings.gradle.kts was not found inside the ZIP."
            echo ""
            echo "=== Extracted directory tree ==="
            find "$ROOT" -maxdepth 6 -print | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo ""
          echo "=========================================="
          echo "Android project detected"
          echo "=========================================="
          echo "Settings file:"
          echo "$SETTINGS_FILE"
          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"
          echo "=========================================="

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 9. Verify Gradle project
      # ============================================================
      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=== Project root ==="
          pwd

          echo ""
          echo "=== Project files ==="
          find . -maxdepth 2 -type f -print | sort

          echo ""
          echo "=== Checking Gradle wrapper ==="

          if [ ! -f "./gradlew" ]; then
            echo "::error::
