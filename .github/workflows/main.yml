name: MICRO-MAX Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          # The repository may contain the Android project directly, or the
          # project may be uploaded as the MICRO-MAX ZIP from a phone.
          if [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          ZIP_FILE=""
          if [ -f "app.zip" ]; then
            ZIP_FILE="app.zip"
          else
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname 'MICRO-MAX*.zip' -print -quit || true)"
          fi

          if [ -n "$ZIP_FILE" ]; then
            rm -rf .ci-src
            mkdir -p .ci-src
            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d .ci-src

            PROJECT="$(find .ci-src -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)"
            if [ -z "$PROJECT" ]; then
              PROJECT="$(find .ci-src -type f -name 'settings.gradle' -print -quit | xargs -r dirname)"
            fi

            if [ -z "$PROJECT" ]; then
              echo "::error::$ZIP_FILE does not contain a Gradle Android project."
              find .ci-src -maxdepth 3 -type f | head -100
              exit 1
            fi

            echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::error::No Android Gradle project or MICRO-MAX ZIP found."
          echo "Expected settings.gradle.kts at the repository root or a MICRO-MAX*.zip."
          exit 1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/settings.gradle.kts" -o -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle.kts" -o -f "$PROJECT_DIR/app/build.gradle"
          echo "Project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          ls -la "$PROJECT_DIR/app"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload MICRO-MAX APK
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-debug
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          
