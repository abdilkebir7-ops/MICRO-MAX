name: MICRO-MAX Real Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Build Signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Android project
        run: |
          set -e
          test -f gradlew
          test -f app/build.gradle.kts
          chmod +x gradlew

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -e
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Keystore
        env:
          KEYSTORE_B64: ${{ secrets.MICROMAX_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_B64"

          mkdir -p "$RUNNER_TEMP/micromax"
          KEYSTORE="$RUNNER_TEMP/micromax/micromax-upload.jks"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          echo "MICROMAX_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Configure Backend
        env:
          API_URL: ${{ secrets.MICROMAX_API_BASE_URL }}
        run: |
          set -e
          test -n "$API_URL"

          case "$API_URL" in
            https://*) echo "Backend HTTPS OK" ;;
            *)
              echo "ERROR: Backend URL must use HTTPS"
              exit 1
              ;;
          esac

          echo "MICROMAX_API_BASE_URL=$API_URL" >> "$GITHUB_ENV"

      - name: Configure Google Client ID
        env:
          GOOGLE_ID: ${{ secrets.MICROMAX_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -e
          test -n "$GOOGLE_ID"
          echo "MICROMAX_GOOGLE_WEB_CLIENT_ID=$GOOGLE_ID" >> "$GITHUB_ENV"

      - name: Check Signing Secrets
        env:
          STORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "Signing configuration OK"

      - name: Clean project
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Build signed APK and AAB
        env:
          MICROMAX_KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          MICROMAX_KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          MICROMAX_KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          ./gradlew \
            :app:assembleRelease \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Check release files
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          test -f "$APK"
          test -f "$AAB"

          mkdir -p release
          cp "$APK" release/MICRO-MAX-release.apk
          cp "$AAB" release/MICRO-MAX-release.aab

          ls -lh release/

      - name: Verify APK
        run: |
          set -e
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose release/MICRO-MAX-release.apk

      - name: Verify AAB
        run: |
          set -e
          jarsigner -verify -certs release/MICRO-MAX-release.aab | tee verify.log
          grep -q "jar verified" verify.log

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-REAL-RELEASE
          path: release/
          if-no-files-found: error
          retention-days: 30
