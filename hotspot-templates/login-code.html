<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MICRO-MAX</title><style>:root{--p:#22d3ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:linear-gradient(145deg,#020617,#0f172a);color:#f8fafc;padding:20px}.card{width:min(430px,100%);padding:28px;border:1px solid #ffffff24;border-radius:28px;background:#ffffff14}.brand{font-size:28px;font-weight:900}.muted{color:#94a3b8;font-size:13px;margin:6px 0 20px}input,button{width:100%;padding:15px;margin-top:10px;border-radius:14px;font-size:18px}input{border:1px solid #ffffff33;background:#0005;color:#fff;text-align:center;letter-spacing:2px;text-transform:uppercase}button{border:0;background:var(--p);color:#001018;font-weight:900}.error{color:#fb7185;margin:10px 0}</style></head><body><main class="card"><div class="brand">MICRO-MAX</div><div class="muted">أدخل كود الكرت فقط</div><div class="error">$(error)</div>
<!-- Code-only login: the card code is sent as both username and password. Requires http-pap (or https) login. -->
<form name="login" action="$(link-login-only)" method="post"><input type="hidden" name="dst" value="$(link-orig)"><input name="username" autocomplete="off" autocapitalize="characters" placeholder="كود الكرت" required><input type="hidden" name="password" value=""><button type="submit">دخول إلى الإنترنت</button></form></main>
<script>(function(){var f=document.forms[0];function sync(){f.password.value=f.username.value}f.username.addEventListener('input',sync);f.addEventListener('submit',sync);try{var q=new URLSearchParams(location.search),u=q.get('username');if(u){f.username.value=u;sync();if(history.replaceState)history.replaceState(null,'',location.pathname);var st=document.querySelector('.error')||{},msg=String(st.textContent||'').trim(),failed=msg!==''&&msg.indexOf('$(')!==0,key='mmauto:'+u,now=Date.now(),last=Number(sessionStorage.getItem(key)||0);if(q.get('auto')==='1'&&!failed&&now-last>15000){sessionStorage.setItem(key,String(now));f.submit();}}}catch(e){}})();</script></body></html>
