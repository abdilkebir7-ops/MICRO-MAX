name: MICRO-MAX Real Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: micromax-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build Signed APK + AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================
      # Android SDK
      # ==========================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          "$ANDROID_HOME/platform-tools/adb" version
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" version

          echo "Android SDK OK"

      # ==========================================
      # Android project
      # ==========================================
      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f gradlew
          test -f app/build.gradle.kts

          chmod +x gradlew

          echo "Android project OK"

      # ==========================================
      # Keystore
      # ==========================================
      - name: Prepare Keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MICROMAX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "ERROR: MICROMAX_KEYSTORE_BASE64 is missing"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/micromax"

          KEYSTORE="$RUNNER_TEMP/micromax/micromax-upload.jks"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "MICROMAX_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Keystore OK"

      # ==========================================
      # Backend
      #
      # اختياري في الـWorkflow.
      # إذا كان Secret موجوداً يتم تمريره.
      # إذا لم يكن موجوداً لا يتوقف البناء هنا.
      # ==========================================
      - name: Configure Backend
        shell: bash
        env:
          API_URL: ${{ secrets.MICROMAX_API_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -n "${API_URL:-}" ]; then

            case "$API_URL" in
              https://*)
                echo "Backend HTTPS OK"
                ;;
              *)
                echo "ERROR: MICROMAX_API_BASE_URL must use HTTPS"
                exit 1
                ;;
            esac

            echo "MICROMAX_API_BASE_URL=$API_URL" >> "$GITHUB_ENV"

            echo "Backend configured"

          else

            echo "MICROMAX_API_BASE_URL is not configured."
            echo "Continuing build without backend override."

          fi

      # ==========================================
      # Google Client ID
      # ==========================================
      - name: Configure Google Client ID
        shell: bash
        env:
          GOOGLE_ID: ${{ secrets.MICROMAX_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail

          if [ -n "${GOOGLE_ID:-}" ]; then
            echo "MICROMAX_GOOGLE_WEB_CLIENT_ID=$GOOGLE_ID" >> "$GITHUB_ENV"
            echo "Google Client ID configured"
          else
            echo "Google Client ID not configured."
            echo "Continuing build."
          fi

      # ==========================================
      # Signing
      # ==========================================
      - name: Check Signing Secrets
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${STORE_PASSWORD:-}"
          test -n "${KEY_ALIAS:-}"
          test -n "${KEY_PASSWORD:-}"

          echo "Signing secrets OK"

      # ==========================================
      # Java / Gradle
      # ==========================================
      - name: Check Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          java -version
          ./gradlew --version

      # ==========================================
      # Clean
      # ==========================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ==========================================
      # Build APK
      # ==========================================
      - name: Build signed APK
        shell: bash
        env:
          MICROMAX_KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          MICROMAX_KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          MICROMAX_KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ==========================================
      # Build AAB
      # ==========================================
      - name: Build signed AAB
        shell: bash
        env:
          MICROMAX_KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          MICROMAX_KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          MICROMAX_KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace

      # ==========================================
      # Check outputs
      # ==========================================
      - name: Check release files
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            find app/build/outputs -type f || true
            exit 1
          fi

          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB was not generated"
            find app/build/outputs -type f || true
            exit 1
          fi

          mkdir -p release

          cp "$APK" release/MICRO-MAX-release.apk
          cp "$AAB" release/MICRO-MAX-release.aab

          ls -lh release

      # ==========================================
      # Verify APK
      # ==========================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            release/MICRO-MAX-release.apk

          echo "APK signature OK"

      # ==========================================
      # Verify AAB
      # ==========================================
      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail

          jarsigner \
            -verify \
            -verbose \
            -certs \
            release/MICRO-MAX-release.aab

          echo "AAB signature OK"

      # ==========================================
      # SHA256
      # ==========================================
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          cd release

          sha256sum \
            MICRO-MAX-release.apk \
            MICRO-MAX-release.aab \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      # ==========================================
      # Upload
      # ==========================================
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-REAL-RELEASE
          path: release/
          if-no-files-found: error
          retention-days: 30
