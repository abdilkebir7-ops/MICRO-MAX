<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة — MICRO-MAX</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/assets/mm.css">
<style>.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.tabs button{padding:8px 16px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font:inherit}.tabs button.on{background:var(--accent);color:#04101c;border-color:transparent}.stat b{font-size:30px;display:block}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sc{overflow:auto;border:1px solid var(--line);border-radius:12px}</style></head>
<body class="glow"><div id="hdr"></div>
<main class="wrap" style="padding:30px 0"><span class="eyebrow">الإدارة</span><h1 style="font-size:clamp(26px,4vw,38px)">لوحة مدير الموقع</h1><div id="deny" class="card" hidden>هذه الصفحة للمدير فقط. <a href="/login.html?next=/admin.html">تسجيل الدخول</a></div>
<div id="app" hidden><div class="tabs" id="tabs"></div><div id="pane"></div></div></main>
<div id="ftr"></div>
<script src="/assets/mm.js"></script><script>
MM.header("admin");MM.footer();const E=MM.esc,$=id=>document.getElementById(id);
const TABS=[["ov","نظرة عامة"],["us","المستخدمون"],["tp","قوالب المتجر"],["rl","الإصدارات"],["an","الإعلانات"],["au","سجل التدقيق"]];let tab="ov";
function init(){$("tabs").innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join("");$("tabs").onclick=e=>{const t=e.target.dataset.t;if(t)go(t);};go("ov");}
async function go(t){tab=t;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));$("pane").innerHTML=`<p class="muted">جارٍ التحميل…</p>`;try{await V[t]();}catch(e){$("pane").innerHTML=`<p style="color:var(--danger)">${E(MM.msg(e))}</p>`;}}
const dt=d=>new Date(d).toLocaleString("ar");
const V={
 async ov(){const s=await MM.api("/api/admin/stats");const c=[["المستخدمون",s.users],["جدد هذا الأسبوع",s.usersWeek],["الراوترات",s.routers],["الكروت",s.cards],["المبيعات",s.sales],["الإيراد",s.revenue],["قوالب مخصصة",s.customTemplates],["تحميلات القوالب",s.templateDownloads],["تحميلات APK",s.apkDownloads],["الإصدارات",s.releases]];$("pane").innerHTML=`<div class="grid g4">${c.map(x=>`<div class="card stat"><span class="muted small">${x[0]}</span><b>${E(x[1])}</b></div>`).join("")}</div>`;},
 async us(){const draw=async q=>{const d=await MM.api("/api/admin/users?q="+encodeURIComponent(q||""));$("ul").innerHTML=`<table class="t"><thead><tr><th>البريد</th><th>الاسم</th><th>الدور</th><th>راوترات</th><th>التسجيل</th><th>الحالة</th></tr></thead><tbody>${d.items.map(u=>`<tr><td>${E(u.email)}</td><td>${E(u.display_name)}</td><td><select data-u="${u.id}" data-k="role" ${u.id===MM.user.id?"disabled":""} style="width:auto;padding:3px 6px">${["admin","owner","staff"].map(r=>`<option ${r===u.role?"selected":""}>${r}</option>`).join("")}</select></td><td>${u.routers}</td><td>${dt(u.created_at)}</td><td>${u.id===MM.user.id?"—":`<button class="btn sm ${u.disabled?"":"danger"}" data-u="${u.id}" data-k="dis" data-v="${!u.disabled}">${u.disabled?"تفعيل":"تعطيل"}</button>`}</td></tr>`).join("")}</tbody></table>`;};
  $("pane").innerHTML=`<input id="uq" placeholder="بحث بالبريد أو الاسم" style="max-width:320px;margin-bottom:12px"><div class="sc" id="ul"></div>`;let t;$("uq").oninput=()=>{clearTimeout(t);t=setTimeout(()=>draw($("uq").value),250);};
  $("pane").onchange=async e=>{const s=e.target;if(s.dataset.k==="role"){try{await MM.api("/api/admin/users/"+s.dataset.u,{method:"PATCH",body:{role:s.value}});MM.toast("تم");}catch(x){MM.fail(x);draw($("uq").value);}}};
  $("pane").onclick=async e=>{const b=e.target.closest("[data-k=dis]");if(!b)return;try{await MM.api("/api/admin/users/"+b.dataset.u,{method:"PATCH",body:{disabled:b.dataset.v==="true"}});draw($("uq").value);}catch(x){MM.fail(x);}};await draw("");},
 async tp(){const d=await MM.api("/api/admin/templates");$("pane").innerHTML=`<div class="grid g2"><div class="card"><h3>إضافة قالب للمتجر</h3><label class="f">الاسم</label><input id="tn"><div class="row2"><div><label class="f">التصنيف</label><input id="tc" value="مخصص"></div><div><label class="f">السعر ($) — 0 = مجاني</label><input id="tpz" type="number" min="0" value="0"></div></div><label class="f">الوصف</label><input id="td"><label class="f">كود HTML (يجب أن يحتوي نموذج الدخول ومتغيرات MikroTik) — أو اختر ملفاً</label><input type="file" id="tf" accept=".html,text/html"><textarea id="th" rows="7" dir="ltr" style="margin-top:6px;font-family:monospace;font-size:12px"></textarea><p id="tm" class="small"></p><button class="btn primary" id="ta">إضافة</button></div><div class="card"><h3>قوالب المتجر المخصصة (${d.items.length})</h3>${d.items.map(t=>`<div style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><div style="flex:1"><b>${E(t.name)}</b> <span class="badge">${E(t.category)}</span> ${t.active?"":'<span class="badge bad">مخفي</span>'}<div class="small muted">${t.price>0?t.price+"$":"مجاني"} · ⬇ ${t.downloads}</div></div><button class="btn sm" data-a="tg" data-i="${t.id}" data-v="${!t.active}">${t.active?"إخفاء":"إظهار"}</button><button class="btn sm danger" data-a="td" data-i="${t.id}">حذف</button></div>`).join("")||'<p class="muted">لا قوالب مخصصة بعد. القوالب الـ12 الجاهزة موجودة دائماً.</p>'}</div></div>`;
  $("tf").onchange=async e=>{const f=e.target.files[0];if(f&&f.size<200000)$("th").value=await f.text();};
  $("ta").onclick=async()=>{try{await MM.api("/api/admin/templates",{method:"POST",body:{name:$("tn").value,category:$("tc").value,price:Number($("tpz").value)||0,description:$("td").value,html:$("th").value}});MM.toast("تمت الإضافة");go("tp");}catch(x){$("tm").style.color="var(--danger)";$("tm").textContent=MM.msg(x)+(x.validation?" — "+x.validation.errors.join(", "):"");}};
  $("pane").onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;try{if(b.dataset.a==="tg")await MM.api("/api/admin/templates/"+b.dataset.i,{method:"PATCH",body:{active:b.dataset.v==="true"}});else if(confirm("حذف القالب؟"))await MM.api("/api/admin/templates/"+b.dataset.i,{method:"DELETE"});else return;go("tp");}catch(x){MM.fail(x);}};},
 async rl(){const d=await MM.api("/api/admin/releases");$("pane").innerHTML=`<div class="grid g2"><div class="card"><h3>نشر إصدار جديد</h3><p class="muted small">ارفع ملف APK إلى GitHub Releases (يفعل ذلك الـ workflow تلقائياً) ثم الصق رابط https هنا.</p><div class="row2"><div><label class="f">رقم الإصدار</label><input id="rv" placeholder="11.4.0" dir="ltr"></div><div><label class="f">الحجم (MB)</label><input id="rs" type="number" step="0.1"></div></div><label class="f">رابط APK (https)</label><input id="ru" dir="ltr"><label class="f">SHA-256 (اختياري)</label><input id="rh" dir="ltr"><label class="f">ملاحظات الإصدار</label><textarea id="rn" rows="4"></textarea><label class="f"><input type="checkbox" id="rm"> تحديث إلزامي</label><label class="f"><input type="checkbox" id="rb"> قناة تجريبية (beta)</label><p id="rmsg" class="small"></p><button class="btn primary" id="ra">نشر</button></div><div class="card"><h3>الإصدارات (${d.items.length})</h3>${d.items.map(r=>`<div style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><div style="flex:1"><b>v${E(r.version)}</b> <span class="badge">${r.channel}</span> ${r.mandatory?'<span class="badge bad">إلزامي</span>':""} ${r.published?"":'<span class="badge warn">مسودة</span>'}<div class="small muted">⬇ ${r.downloads} · ${dt(r.createdAt)}</div></div><button class="btn sm" data-a="rp" data-i="${r.id}" data-v="${!r.published}">${r.published?"إلغاء النشر":"نشر"}</button><button class="btn sm danger" data-a="rd" data-i="${r.id}">حذف</button></div>`).join("")||'<p class="muted">لا إصدارات</p>'}</div></div>`;
  $("ra").onclick=async()=>{try{await MM.api("/api/admin/releases",{method:"POST",body:{version:$("rv").value,apkUrl:$("ru").value,sha256:$("rh").value,notes:$("rn").value,sizeMb:Number($("rs").value)||undefined,mandatory:$("rm").checked,channel:$("rb").checked?"beta":"stable"}});MM.toast("تم النشر");go("rl");}catch(x){$("rmsg").style.color="var(--danger)";$("rmsg").textContent=MM.msg(x);}};
  $("pane").onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;try{if(b.dataset.a==="rp")await MM.api("/api/admin/releases/"+b.dataset.i,{method:"PATCH",body:{published:b.dataset.v==="true"}});else if(confirm("حذف الإصدار؟"))await MM.api("/api/admin/releases/"+b.dataset.i,{method:"DELETE"});else return;go("rl");}catch(x){MM.fail(x);}};},
 async an(){const d=await MM.api("/api/admin/announcements");$("pane").innerHTML=`<div class="grid g2"><div class="card"><h3>إعلان جديد</h3><label class="f">العنوان</label><input id="at" maxlength="100"><label class="f">النص</label><textarea id="ab" rows="3"></textarea><label class="f">النوع</label><select id="al"><option value="info">معلومة</option><option value="warning">تنبيه</option><option value="success">خبر سار</option></select><button class="btn primary" id="aa" style="margin-top:10px">نشر</button></div><div class="card"><h3>الإعلانات</h3>${d.items.map(a=>`<div style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><div style="flex:1"><b>${E(a.title)}</b> ${a.active?"":'<span class="badge">مخفي</span>'}<div class="small muted">${E(a.body)}</div></div><button class="btn sm" data-a="at" data-i="${a.id}" data-v="${!a.active}">${a.active?"إخفاء":"إظهار"}</button><button class="btn sm danger" data-a="ad" data-i="${a.id}">حذف</button></div>`).join("")||'<p class="muted">لا إعلانات</p>'}</div></div>`;
  $("aa").onclick=async()=>{try{await MM.api("/api/admin/announcements",{method:"POST",body:{title:$("at").value,body:$("ab").value,level:$("al").value}});go("an");}catch(x){MM.fail(x);}};
  $("pane").onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;try{if(b.dataset.a==="at")await MM.api("/api/admin/announcements/"+b.dataset.i,{method:"PATCH",body:{active:b.dataset.v==="true"}});else await MM.api("/api/admin/announcements/"+b.dataset.i,{method:"DELETE"});go("an");}catch(x){MM.fail(x);}};},
 async au(){const d=await MM.api("/api/admin/audit");$("pane").innerHTML=`<div class="sc"><table class="t"><thead><tr><th>الوقت</th><th>المستخدم</th><th>الحدث</th><th>الكيان</th></tr></thead><tbody>${d.items.map(a=>`<tr><td>${dt(a.created_at)}</td><td>${E(a.email||"")}</td><td>${E(a.action)}</td><td>${E(a.entity)}</td></tr>`).join("")}</tbody></table></div>`;}
};
if(!MM.user||MM.user.role!=="admin"){$("deny").hidden=false;}else{$("app").hidden=false;init();}
</script></body></html>
