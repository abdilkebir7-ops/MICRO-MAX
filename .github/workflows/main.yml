name: MICRO-MAX Real Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Build Signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # =========================================================
      # 2. Check Android project
      # =========================================================
      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          test -f gradlew
          test -f app/build.gradle.kts

          chmod +x gradlew

          echo "Android project detected successfully."

      # =========================================================
      # 3. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # =========================================================
      # 4. Android SDK
      #
      # IMPORTANT:
      # Do NOT install the old "tools" package.
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # =========================================================
      # 5. Verify Android SDK
      # =========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Checking platform-tools..."
          test -d "$ANDROID_HOME/platform-tools"

          echo "Checking Android 35..."
          test -d "$ANDROID_HOME/platforms/android-35"

          echo "Checking Build Tools 35..."
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Checking adb..."
          adb version

          echo "Checking sdkmanager..."
          sdkmanager --version

          echo "Android SDK is ready."

      # =========================================================
      # 6. Prepare Keystore
      # =========================================================
      - name: Prepare Keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MICROMAX_KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_B64"

          mkdir -p "$RUNNER_TEMP/micromax"

          KEYSTORE="$RUNNER_TEMP/micromax/micromax-upload.jks"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "MICROMAX_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Keystore prepared successfully."

      # =========================================================
      # 7. Check Backend
      # =========================================================
      - name: Configure Backend
        shell: bash
        env:
          API_URL: ${{ secrets.MICROMAX_API_BASE_URL }}
        run: |
          set -e

          test -n "$API_URL"

          case "$API_URL" in
            https://*)
              echo "Backend HTTPS: OK"
              ;;
            *)
              echo "ERROR: MICROMAX_API_BASE_URL must start with https://"
              exit 1
              ;;
          esac

          echo "MICROMAX_API_BASE_URL=$API_URL" >> "$GITHUB_ENV"

      # =========================================================
      # 8. Google Web Client ID
      # =========================================================
      - name: Configure Google Client ID
        shell: bash
        env:
          GOOGLE_ID: ${{ secrets.MICROMAX_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -e

          test -n "$GOOGLE_ID"

          echo "MICROMAX_GOOGLE_WEB_CLIENT_ID=$GOOGLE_ID" >> "$GITHUB_ENV"

          echo "Google Client ID configured."

      # =========================================================
      # 9. Signing secrets
      # =========================================================
      - name: Check Signing Secrets
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "Signing secrets are available."

      # =========================================================
      # 10. Check Java / Gradle
      # =========================================================
      - name: Check Java and Gradle
        shell: bash
        run: |
          set -e

          java -version

          ./gradlew --version

      # =========================================================
      # 11. Clean
      # =========================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 12. Build signed APK
      # =========================================================
      - name: Build signed APK
        shell: bash
        env:
          MICROMAX_KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          MICROMAX_KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          MICROMAX_KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -e

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 13. Build signed AAB
      # =========================================================
      - name: Build signed AAB
        shell: bash
        env:
          MICROMAX_KEYSTORE_PASSWORD: ${{ secrets.MICROMAX_KEYSTORE_PASSWORD }}
          MICROMAX_KEY_ALIAS: ${{ secrets.MICROMAX_KEY_ALIAS }}
          MICROMAX_KEY_PASSWORD: ${{ secrets.MICROMAX_KEY_PASSWORD }}
        run: |
          set -e

          ./gradlew \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 14. Check generated files
      # =========================================================
      - name: Check release files
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          echo "Checking APK..."
          test -f "$APK"

          echo "Checking AAB..."
          test -f "$AAB"

          mkdir -p release

          cp "$APK" \
            release/MICRO-MAX-release.apk

          cp "$AAB" \
            release/MICRO-MAX-release.aab

          echo ""
          echo "================================"
          echo "RELEASE FILES"
          echo "================================"

          ls -lh release/

      # =========================================================
      # 15. Verify APK signature
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -f "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            release/MICRO-MAX-release.apk

          echo "APK signature verified successfully."

      # =========================================================
      # 16. Verify AAB signature
      # =========================================================
      - name: Verify AAB signature
        shell: bash
        run: |
          set -e

          jarsigner \
            -verify \
            -certs \
            release/MICRO-MAX-release.aab

          echo "AAB signature verified successfully."

      # =========================================================
      # 17. Upload APK + AAB
      # =========================================================
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: MICRO-MAX-REAL-RELEASE
          path: release/
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 18. Final message
      # =========================================================
      - name: Release completed
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " MICRO-MAX RELEASE BUILD COMPLETED"
          echo "=========================================="
          echo ""
          echo "APK:"
          echo "release/MICRO-MAX-release.apk"
          echo ""
          echo "AAB:"
          echo "release/MICRO-MAX-release.aab"
          echo ""
          echo "Artifact:"
          echo "MICRO-MAX-REAL-RELEASE"
          echo ""
